<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>카드샵 관리자</title><link rel="stylesheet" href="style.css"></head><body><header class="top"><div class="head"><h1>오리진 카드샵 관리자</h1><div class="sub">재고·판매가·북미가·바인더 보유는 관리자만 확인/수정</div></div></header><main class="wrap"><div id="loginPanel" class="panel"><b>관리자 로그인</b><div class="grid2" style="margin-top:8px"><input id="email" type="email" placeholder="이메일"><input id="password" type="password" placeholder="비밀번호"></div><button id="loginBtn" style="margin-top:8px">로그인</button><div id="msg" class="sub"></div></div><div id="adminPanel" class="hidden"><div class="panel"><div class="grid3"><input id="kakao" placeholder="카카오 오픈채팅 URL"><input id="store" placeholder="판매페이지 이름"><button id="saveSettings">설정 저장</button></div><input id="noticeInput" style="width:100%;margin-top:8px" placeholder="판매페이지 안내문"></div><div class="panel"><div class="toolbar"><input id="q" placeholder="카드명/번호 검색"><select id="saleOnly"><option value="">전체</option><option value="sale">판매가능만</option></select><button id="saveAll">변경 저장</button><button id="logoutBtn">로그아웃</button></div></div><div style="overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:12px"><table><thead><tr><th>번호</th><th>카드명</th><th>피니시</th><th>판매수량</th><th>판매가</th><th>북미가</th><th>바인더</th></tr></thead><tbody id="tbody"></tbody></table></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const C=window.RIFTBOUND_CONFIG,S=window.supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY);let cards=[];async function check(){const {data:{session}}=await S.auth.getSession();session?show():loginPanel.classList.remove('hidden')}async function show(){loginPanel.classList.add('hidden');adminPanel.classList.remove('hidden');await Promise.all([loadCards(),loadSettings()])}loginBtn.onclick=async()=>{const {error}=await S.auth.signInWithPassword({email:email.value.trim(),password:password.value});msg.textContent=error?error.message:'로그인 완료';if(!error)show()};logoutBtn.onclick=async()=>{await S.auth.signOut();adminPanel.classList.add('hidden');loginPanel.classList.remove('hidden')};async function loadCards(){const {data,error}=await S.from('cards').select('*').order('sort_no');if(error)return alert(error.message);cards=data||[];render()}async function loadSettings(){const {data}=await S.from('shop_settings').select('*').eq('id',1).maybeSingle();if(data){kakao.value=data.kakao_openchat_url||'';store.value=data.store_name||'';noticeInput.value=data.notice||''}}function render(){const s=q.value.trim().toLowerCase(),only=saleOnly.value;const list=cards.filter(c=>(!s||(`${c.name_ko} ${c.card_no}`.toLowerCase().includes(s)))&&(!only||c.sell_qty>0));tbody.innerHTML=list.map(c=>`<tr data-code="${c.code}"><td>${c.card_no}</td><td>${c.name_ko}</td><td>${c.finish}</td><td><input class="qty" type="number" min="0" value="${c.sell_qty}"></td><td><input class="price" type="number" min="0" step="100" value="${c.sell_price}"></td><td><input class="na" type="number" min="0" step="100" value="${c.north_america_price||0}"></td><td><input class="binder" type="checkbox" ${c.binder_owned?'checked':''}></td></tr>`).join('')}q.oninput=render;saleOnly.onchange=render;saveAll.onclick=async()=>{const updates=[...tbody.querySelectorAll('tr')].map(tr=>{const c=cards.find(x=>x.code===tr.dataset.code);return {...c,sell_qty:Number(tr.querySelector('.qty').value||0),sell_price:Number(tr.querySelector('.price').value||0),north_america_price:Number(tr.querySelector('.na').value||0),binder_owned:tr.querySelector('.binder').checked,updated_at:new Date().toISOString()}});const {error}=await S.from('cards').upsert(updates,{onConflict:'code'});alert(error?error.message:'저장 완료');if(!error)loadCards()};saveSettings.onclick=async()=>{const {error}=await S.from('shop_settings').upsert({id:1,kakao_openchat_url:kakao.value.trim(),store_name:store.value.trim()||'리프트바운드 오리진 카드샵',notice:noticeInput.value.trim(),updated_at:new Date().toISOString()},{onConflict:'id'});alert(error?error.message:'설정 저장 완료')};check();
</script></body></html>

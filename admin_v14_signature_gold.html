<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>오리진 카드샵 관리자</title>
<link rel="stylesheet" href="style.css">
<style>
:root{--bg:#f7f7f8;--panel:#fff;--text:#171717;--muted:#71717a;--line:#e7e7ea}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
.top{position:sticky;top:0;z-index:30;background:rgba(247,247,248,.97);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.head,.wrap{max-width:1150px;margin:auto;padding:8px}
h1{font-size:17px;margin:0 0 5px}
.hidden{display:none!important}
.sub,.tiny{font-size:9px;color:var(--muted)}
.panel,.card,.summary-box{background:#fff;border:1px solid var(--line);border-radius:10px}
.panel{padding:8px;margin-bottom:8px}
.topline{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:5px;align-items:center}
.topline input,.topline button,.panel input,.panel select,.panel button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px;font-size:11px;min-width:0}
.total-chip{padding:7px 9px;background:#fff;border:1px solid var(--line);border-radius:8px;font-size:11px;font-weight:800;white-space:nowrap}
.manage-panel{display:none;margin-top:6px}
.manage-panel.open{display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.controls-section{padding-top:6px;margin-top:6px;border-top:1px solid var(--line)}
.controls-section:first-child{border-top:0;margin-top:0;padding-top:0}
.view-switch{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.view-switch button.active{background:#111;color:#fff;border-color:#111}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.stat{background:#fafafa;border:1px solid var(--line);border-radius:8px;padding:6px}
.stat b{display:block;font-size:12px}
.stat span{font-size:8px;color:var(--muted)}
.bulk{display:none;margin-top:5px}
.bulk.open{display:block}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{overflow:hidden}
.card.dirty{outline:2px solid #f59e0b}
.img{width:100%;aspect-ratio:5/7;object-fit:cover;background:#eee}
.body{padding:7px}
.name{font-size:12px;font-weight:750;line-height:1.25}
.meta{font-size:9px;color:var(--muted);margin-top:2px}
.price{font-size:14px;font-weight:800;margin-top:4px}
.ctrl{display:grid;grid-template-columns:auto 1fr;gap:5px;align-items:center;margin-top:5px}
.qty{display:grid;grid-template-columns:28px 1fr 28px;gap:3px}
.qty input{text-align:center;width:100%}
.edit{margin-top:4px}
.edit input{width:100%}
.value{font-size:9px;color:var(--muted);margin-top:4px}
.list-wrap{display:none;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:auto}
.list-wrap.open{display:block}
.list-table{width:100%;min-width:760px;border-collapse:collapse;font-size:10px}
.list-table th,.list-table td{padding:4px 4px;border-bottom:1px solid #ececef;text-align:left;white-space:nowrap}
.list-table th{position:sticky;top:0;background:#fafafa;z-index:2}
.list-table tr.dirty{background:#fff8e6}
.list-table input[type="number"]{width:70px;padding:5px}
.list-table .listqty{display:grid;grid-template-columns:24px 46px 24px;gap:2px}
.list-table .listqty input{text-align:center;width:46px}
.list-name{max-width:190px;overflow:hidden;text-overflow:ellipsis}
#cards.list-mode{display:none}
@media(max-width:850px){
  .cards{grid-template-columns:repeat(2,1fr)}
  .topline{grid-template-columns:minmax(0,1fr) auto}
  .total-chip{grid-column:1/-1;text-align:center}
  .grid4{grid-template-columns:1fr 1fr}
  .grid3{grid-template-columns:1fr 1fr}
  .stats{grid-template-columns:1fr 1fr 1fr}
}

.foil-badge{
  position:absolute;
  top:7px;
  left:7px;
  z-index:4;
  padding:4px 8px;
  border-radius:7px;
  color:#111;
  font-size:10px;
  font-weight:950;
  letter-spacing:.08em;
  border:1px solid rgba(255,255,255,.75);
  background:
    linear-gradient(115deg,
      rgba(255,255,255,.95) 0%,
      rgba(255,214,255,.95) 18%,
      rgba(193,232,255,.95) 36%,
      rgba(255,255,190,.95) 54%,
      rgba(218,196,255,.95) 72%,
      rgba(255,255,255,.95) 100%);
  background-size:220% 220%;
  box-shadow:0 1px 6px rgba(0,0,0,.28), inset 0 0 4px rgba(255,255,255,.9);
  animation:foilShine 2.2s linear infinite;
}
@keyframes foilShine{
  0%{background-position:0% 50%;filter:brightness(1)}
  50%{background-position:100% 50%;filter:brightness(1.18)}
  100%{background-position:0% 50%;filter:brightness(1)}
}
.card{position:relative}


.list-table th:nth-child(1),.list-table td:nth-child(1){width:72px}
.list-table th:nth-child(2),.list-table td:nth-child(2){width:auto;max-width:135px}
.list-table th:nth-child(3),.list-table td:nth-child(3){width:52px}
.list-table th:nth-child(4),.list-table td:nth-child(4){width:78px;text-align:center}
.list-table th:nth-child(5),.list-table td:nth-child(5){width:98px}
.list-table th:nth-child(6),.list-table td:nth-child(6){width:68px}
.list-table th:nth-child(7),.list-table td:nth-child(7){width:74px}
.list-table th:nth-child(8),.list-table td:nth-child(8){width:82px}
.list-table button{padding:3px 4px}
@media(max-width:850px){
  .list-table{font-size:9px}
  .list-name{max-width:105px}
  .list-table th,.list-table td{padding:3px}
}


.card.missing{
  opacity:.62;
}
.card.missing .img{
  filter:brightness(.45) grayscale(.35);
}
.card.missing::after{
  content:"미보유";
  position:absolute;
  top:42%;
  left:50%;
  transform:translate(-50%,-50%);
  z-index:5;
  padding:6px 11px;
  border-radius:999px;
  background:rgba(0,0,0,.72);
  color:#fff;
  font-size:10px;
  font-weight:900;
  letter-spacing:.08em;
  pointer-events:none;
}
.list-table tr.missing{
  opacity:.58;
  background:#f3f3f4;
}


.qty-only{display:block;margin-top:5px}
.qty-only .qty{
  display:grid;
  grid-template-columns:34px 1fr 34px;
  gap:4px;
  align-items:center;
}
.qty-only .qty button{
  height:32px;
  font-size:17px;
  font-weight:800;
}
.qtynum{
  display:flex;
  align-items:center;
  justify-content:center;
  height:32px;
  border:1px solid var(--line);
  border-radius:7px;
  background:#fafafa;
  font-size:14px;
  font-weight:900;
  color:#111;
}


/* v13 mobile ultra-compact list */
@media(max-width:850px){
  .list-wrap{
    overflow-x:hidden;
  }
  .list-table{
    width:100%;
    min-width:0!important;
    table-layout:fixed!important;
    font-size:8px!important;
  }
  .list-table th,
  .list-table td{
    padding:2px 2px!important;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  /* 번호 */
  .list-table th:nth-child(1),
  .list-table td:nth-child(1){
    width:50px!important;
  }

  /* 카드명 */
  .list-table th:nth-child(2),
  .list-table td:nth-child(2){
    width:auto!important;
    max-width:none!important;
  }

  /* 피니시 */
  .list-table th:nth-child(3),
  .list-table td:nth-child(3){
    width:34px!important;
    text-align:center;
    font-size:7px!important;
  }

  /* 마지막 1장 판매 */
  .list-table th:nth-child(4),
  .list-table td:nth-child(4){
    width:34px!important;
    text-align:center;
  }

  /* 전체수량 */
  .list-table th:nth-child(5),
  .list-table td:nth-child(5){
    width:70px!important;
  }

  /* 판매가 */
  .list-table th:nth-child(6),
  .list-table td:nth-child(6){
    width:52px!important;
  }

  /* 북미가 / 보유가치는 모바일에서 숨김 */
  .list-table th:nth-child(7),
  .list-table td:nth-child(7),
  .list-table th:nth-child(8),
  .list-table td:nth-child(8){
    display:none!important;
  }

  .list-table .listqty{
    grid-template-columns:18px 30px 18px!important;
    gap:1px!important;
  }
  .list-table .listqty button{
    width:18px!important;
    min-width:18px!important;
    height:24px!important;
    padding:0!important;
    font-size:11px!important;
  }
  .list-table .listqty input{
    width:30px!important;
    height:24px!important;
    padding:1px!important;
    font-size:9px!important;
  }

  .list-table input.l-price{
    width:48px!important;
    height:24px!important;
    padding:2px!important;
    font-size:9px!important;
  }

  .list-table input[type="checkbox"]{
    transform:scale(.85);
    margin:0;
  }

  .list-name{
    max-width:none!important;
    font-size:8px!important;
  }
}


.signature-badge{
  position:absolute;
  top:7px;
  right:7px;
  z-index:6;
  padding:4px 8px;
  border-radius:7px;
  color:#3a2500;
  font-size:9px;
  font-weight:950;
  letter-spacing:.06em;
  border:1px solid rgba(255,245,180,.95);
  background:
    linear-gradient(115deg,
      #fff7bf 0%,
      #d9a928 18%,
      #fff1a8 36%,
      #b87b00 54%,
      #ffe36d 72%,
      #fff8d2 100%);
  background-size:220% 220%;
  box-shadow:0 1px 6px rgba(120,75,0,.35), inset 0 0 5px rgba(255,255,255,.8);
  animation:signatureShine 2.4s linear infinite;
}
@keyframes signatureShine{
  0%{background-position:0% 50%;filter:brightness(1)}
  50%{background-position:100% 50%;filter:brightness(1.18)}
  100%{background-position:0% 50%;filter:brightness(1)}
}

</style>
</head>
<body>
<header class="top">
  <div class="head">
    <h1>오리진 카드샵 관리자</h1>

    <div id="loginPanel" class="panel">
      <div class="grid3">
        <input id="email" type="email" placeholder="관리자 이메일">
        <input id="password" type="password" placeholder="비밀번호">
        <button id="loginBtn">로그인</button>
      </div>
      <div id="loginMsg" class="sub"></div>
    </div>

    <div id="adminTop" class="hidden">
      <div class="topline">
        <input id="q" placeholder="카드명 / 번호 검색">
        <button id="manageToggle">관리 메뉴 열기</button>
        <div class="total-chip">총 보유가치 <span id="totalValueTop">₩0</span></div>
      </div>

      <div id="managePanel" class="manage-panel panel">
        <div class="controls-section">
          <div class="view-switch">
            <button id="albumViewBtn" class="active">앨범보기</button>
            <button id="listViewBtn">목록보기</button>
          </div>
        </div>

        <div class="controls-section grid3">
          <select id="rarity"><option value="">전체 레어도</option></select>
          <select id="own">
            <option value="">전체</option>
            <option value="owned">보유중</option>
            <option value="missing">미보유</option>
            <option value="sellable">판매가능</option>
            <option value="hidden">판매불가</option>
          </select>
          <select id="variant">
            <option value="">전체 유형</option>
            <option>Standard</option>
            <option>Alt Art</option>
            <option>Overnumber</option>
            <option>KR Overnumber</option>
            <option>Signature</option>
          </select>
          <select id="finish">
            <option value="">전체 피니시</option>
            <option>NORMAL</option>
            <option>FOIL</option>
          </select>
          <select id="sort">
            <option value="number">번호순</option>
            <option value="priceDesc">가격 높은순</option>
            <option value="priceAsc">가격 낮은순</option>
            <option value="name">이름순</option>
          </select>
          <div style="display:flex;align-items:center;gap:4px">
            <span class="sub">환율</span>
            <input id="fx" type="number" min="500" step="10" style="width:100%" value="1400">
          </div>
        </div>

        <div class="controls-section sub" style="line-height:1.5">
수량은 <b>전체 보유수량</b> 기준. 기본상태에서는 1장을 보관하고 <b>2장째부터 자동 판매</b>돼. <b>마지막 1장도 판매</b>를 체크하면 보유수량 전부 판매페이지에 노출돼.
</div>
<div class="controls-section stats">
          <div class="stat"><b id="sOwned">0</b><span>보유 카드종</span></div>
          <div class="stat"><b id="sSaleQty">0</b><span>판매가능 수량</span></div>
          <div class="stat"><b id="sSaleVal">₩0</b><span>판매재고 가치</span></div>
          <div class="stat"><b id="sFiltered">0</b><span>필터 카드</span></div>
          <div class="stat"><b id="sFilteredVal">₩0</b><span>필터 보유가치</span></div>
          <div class="stat"><b id="autosaveStatus">자동 저장 ON</b><span>저장상태</span></div>
        </div>

        <div class="controls-section grid4">
          <button id="exportBtn">현재 필터 CSV</button>
          <button id="bulkToggle">필터 일괄가격</button>
          <button id="saveBtn">수동 저장</button>
          <button id="logoutBtn">로그아웃</button>
        </div>

        <div id="bulk" class="bulk controls-section">
          <div class="grid2">
            <select id="bulkCond">
              <option value="equal">현재가가 정확히</option>
              <option value="lte">현재가 이하</option>
              <option value="gte">현재가 이상</option>
              <option value="range">현재가 범위</option>
              <option value="all">현재가 무관</option>
            </select>
            <select id="bulkFin">
              <option value="visible">현재 피니시 필터 기준</option>
              <option value="NORMAL">NORMAL만</option>
              <option value="FOIL">FOIL만</option>
              <option value="both">둘 다</option>
            </select>
          </div>
          <div class="grid2" style="margin-top:4px">
            <input id="bulkFrom" type="number" step=".1" placeholder="현재가 (1=100원)">
            <input id="bulkTo" type="number" step=".1" placeholder="변경가 (1=100원)">
          </div>
          <div id="rangeRow" class="grid2" style="display:none;margin-top:4px">
            <input id="bulkMin" type="number" step=".1" placeholder="범위 최소">
            <input id="bulkMax" type="number" step=".1" placeholder="범위 최대">
          </div>
          <div class="grid3" style="margin-top:4px">
            <div id="bulkStatus" class="sub">현재 필터에만 적용</div>
            <button id="bulkApply">적용</button>
            <button id="bulkUndo">복원</button>
          </div>
        </div>

        <div class="controls-section">
          <div class="grid3">
            <input id="kakao" placeholder="카카오톡 오픈채팅 URL">
            <input id="store" placeholder="판매페이지 이름">
            <button id="saveSettings">설정 저장</button>
          </div>
          <input id="notice" style="width:100%;margin-top:4px" placeholder="판매페이지 안내문">
        </div>
      </div>
    </div>
  </div>
</header>

<main class="wrap">
  <div id="cards" class="cards"></div>
  <div id="listWrap" class="list-wrap">
    <table class="list-table">
      <thead><tr>
        <th>번호</th><th>카드명</th><th>피니시</th><th>마지막 1장 판매</th>
        <th>전체수량</th><th>판매가</th><th>북미가</th><th>보유가치</th>
      </tr></thead>
      <tbody id="listBody"></tbody>
    </table>
  </div>
  <div style="height:80px"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const C=window.RIFTBOUND_CONFIG;
const S=window.supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY);

let cards=[],original={},dirty=new Set();
let viewMode=localStorage.getItem("riftbound_admin_view")||"album";
let fx=Number(localStorage.getItem("riftbound_admin_fx")||1400);
let autosaveTimer=null;

const BASE_FX=1400;
const $=s=>document.querySelector(s);
const won=n=>"₩"+Math.round(Number(n||0)).toLocaleString("ko-KR");
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const u2k=v=>Math.max(0,Math.round(Number(v||0)*100));
const k2u=v=>Number(v||0)?Number(v)/100:"";
const naKrw=c=>Math.round(Number(c.north_america_price||0)*(fx/BASE_FX));
const cv=c=>Number(c.total_qty||0)*Number(c.sell_price||0);
const saleQty=c=>c.sale_enabled?Math.max(0,Number(c.total_qty||0)):Math.max(0,Number(c.total_qty||0)-1);
const sv=c=>saleQty(c)*Number(c.sell_price||0);


function isSignature(c){
  return String(c.variant||"").trim().toLowerCase()==="signature";
}

function isCUFoil(c){
  const r=String(c.rarity||"").trim().toLowerCase();
  const isCU=["common","uncommon","커먼","언커먼","c","u"].includes(r);
  return isCU && String(c.finish||"").toUpperCase()==="FOIL";
}
function imgs(c){
  let a=[];
  if(c.image_url)a.push(c.image_url);
  const m=String(c.card_no||"").match(/OGN-([0-9]{3}[a-z]?|[0-9]{3}\*)/i);
  if(m){
    let r=m[1].toLowerCase();
    if(r.endsWith("*")){
      let n=r.replace("*","");
      a.push(
        `https://d3a8eduw4bm8.cloudfront.net/riftbound/cards/ogn/${n}-star-kr.webp`,
        `https://d3a8eduw4bm8.cloudfront.net/riftbound/cards/ogn/${n}-signature-kr.webp`,
        `https://d3a8eduw4bm8.cloudfront.net/riftbound/cards/ogn/${n}-kr.webp`
      );
    }else{
      a.push(`https://d3a8eduw4bm8.cloudfront.net/riftbound/cards/ogn/${r}-kr.webp`);
    }
  }
  return [...new Set(a)];
}
function ni(i){
  try{
    let a=JSON.parse(i.dataset.f||"[]");
    if(!a.length){i.onerror=null;i.style.visibility="hidden";return}
    i.src=a.shift();i.dataset.f=JSON.stringify(a);
  }catch{i.style.visibility="hidden"}
}
function ih(c){
  let a=imgs(c);
  return a.length?`<img class="img" src="${esc(a[0])}" data-f='${esc(JSON.stringify(a.slice(1)))}' onerror="ni(this)" loading="lazy">`:'<div class="img"></div>';
}

async function check(){
  const {data:{session}}=await S.auth.getSession();
  session?show():hide();
}
function hide(){
  $("#loginPanel").classList.remove("hidden");
  $("#adminTop").classList.add("hidden");
}
async function show(){
  $("#loginPanel").classList.add("hidden");
  $("#adminTop").classList.remove("hidden");
  $("#fx").value=fx;
  await Promise.all([loadCards(),loadSettings()]);
}
$("#loginBtn").onclick=async()=>{
  const {error}=await S.auth.signInWithPassword({email:$("#email").value.trim(),password:$("#password").value});
  $("#loginMsg").textContent=error?error.message:"로그인 완료";
  if(!error)show();
};
$("#logoutBtn").onclick=async()=>{await S.auth.signOut();hide()};

async function loadCards(){
  const {data,error}=await S.from("cards").select("*").order("sort_no",{ascending:true});
  if(error)return alert(error.message);
  cards=(data||[]).map(x=>({...x,total_qty:Number(x.total_qty ?? Number(x.sell_qty||0)),sale_enabled:Boolean(x.sale_enabled ?? (Number(x.sell_qty||0)>0))}));
  original=Object.fromEntries(cards.map(c=>[c.code,JSON.parse(JSON.stringify(c))]));
  dirty.clear();
  buildRarity();
  render();
}
async function loadSettings(){
  const {data}=await S.from("shop_settings").select("*").eq("id",1).maybeSingle();
  if(data){
    $("#kakao").value=data.kakao_openchat_url||"";
    $("#store").value=data.store_name||"";
    $("#notice").value=data.notice||"";
  }
}
$("#saveSettings").onclick=async()=>{
  const {error}=await S.from("shop_settings").upsert({
    id:1,
    kakao_openchat_url:$("#kakao").value.trim(),
    store_name:$("#store").value.trim()||"리프트바운드 오리진 카드샵",
    notice:$("#notice").value.trim(),
    updated_at:new Date().toISOString()
  },{onConflict:"id"});
  alert(error?error.message:"설정 저장 완료");
};

function buildRarity(){
  const s=$("#rarity"),cur=s.value;
  s.innerHTML='<option value="">전체 레어도</option>';
  [...new Set(cards.map(c=>c.rarity).filter(Boolean))].sort().forEach(x=>s.insertAdjacentHTML("beforeend",`<option>${esc(x)}</option>`));
  s.value=cur;
}
function filtered(){
  const q=$("#q").value.trim().toLowerCase(),r=$("#rarity").value,o=$("#own").value,v=$("#variant").value,f=$("#finish").value;
  let a=cards.filter(c=>{
    if(q&&!(`${c.name_ko} ${c.card_no}`.toLowerCase().includes(q)))return false;
    if(r&&c.rarity!==r)return false;
    if(o==="owned"&&Number(c.total_qty||0)<1)return false;
    if(o==="missing"&&Number(c.total_qty||0)>0)return false;
    if(o==="sellable"&&saleQty(c)<1)return false;
    if(o==="hidden"&&saleQty(c)>0)return false;
    if(v&&c.variant!==v)return false;
    if(f&&c.finish!==f)return false;
    return true;
  });
  const s=$("#sort").value;
  if(s==="priceDesc")a.sort((x,y)=>Number(y.sell_price)-Number(x.sell_price));
  else if(s==="priceAsc")a.sort((x,y)=>Number(x.sell_price)-Number(y.sell_price));
  else if(s==="name")a.sort((x,y)=>String(x.name_ko).localeCompare(String(y.name_ko),"ko"));
  else a.sort((x,y)=>Number(x.sort_no||9999)-Number(y.sort_no||9999));
  return a;
}
function stats(a){
  const total=cards.reduce((x,c)=>x+cv(c),0);
  $("#totalValueTop").textContent=won(total);
  $("#sOwned").textContent=cards.filter(c=>Number(c.total_qty||0)>0).length.toLocaleString();
  $("#sSaleQty").textContent=cards.reduce((x,c)=>x+saleQty(c),0).toLocaleString();
  $("#sSaleVal").textContent=won(cards.reduce((x,c)=>x+sv(c),0));
  $("#sFiltered").textContent=a.length.toLocaleString();
  $("#sFilteredVal").textContent=won(a.reduce((x,c)=>x+cv(c),0));
}
function render(){
  const a=filtered();
  stats(a);

  $("#cards").innerHTML=a.length?a.map(c=>`
    <article class="card ${dirty.has(c.code)?"dirty":""} ${Number(c.total_qty||0)<1?"missing":""}" data-code="${esc(c.code)}">
      ${ih(c)}
      ${isCUFoil(c)?'<div class="foil-badge">FOIL</div>':""}
      ${isSignature(c)?'<div class="signature-badge">SIGNATURE</div>':""}
      <div class="body">
        <div class="name">${esc(c.name_ko)}</div>
        <div class="meta">${esc(c.card_no)} · ${esc(c.rarity||"")} · ${esc(c.variant||"Standard")} · ${esc(c.finish)}</div>
        <div class="price">${won(c.sell_price)} <span class="tiny">(북미 ${won(naKrw(c))})</span></div>
        <div class="ctrl qty-only">
          <div class="qty">
            <button class="minus">−</button>
            <span class="qtynum">${Number(c.total_qty||0)}</span>
            <button class="plus">＋</button>
          </div>
        </div>
        <div class="edit"><input class="pricei" type="number" step=".1" min="0" value="${k2u(c.sell_price)}" placeholder="판매가 1=100원"></div>
        <div class="value">전체 ${Number(c.total_qty||0)}장 · 판매가능 ${saleQty(c)}장 · 보유가치 ${won(cv(c))}</div>
      </div>
    </article>`).join(""):'<div class="panel">조건에 맞는 카드가 없어.</div>';

  $("#listBody").innerHTML=a.length?a.map(c=>`
    <tr class="${dirty.has(c.code)?"dirty":""} ${Number(c.total_qty||0)<1?"missing":""}" data-code="${esc(c.code)}">
      <td>${esc(c.card_no)}</td>
      <td class="list-name">${esc(c.name_ko)}</td>
      <td>${esc(c.finish)}</td>
      <td><input class="l-sale" type="checkbox" ${c.sale_enabled?"checked":""}></td>
      <td>
        <div class="listqty">
          <button class="l-minus">−</button>
          <input class="l-qty" type="number" min="0" value="${Number(c.total_qty||0)}">
          <button class="l-plus">＋</button>
        </div>
      </td>
      <td><input class="l-price" type="number" step=".1" min="0" value="${k2u(c.sell_price)}"></td>
      <td>${won(naKrw(c))}</td>
      <td>${won(cv(c))}</td>
    </tr>`).join(""):'<tr><td colspan="8">조건에 맞는 카드가 없어.</td></tr>';

  applyViewMode();
}
function applyViewMode(){
  const list=viewMode==="list";
  $("#cards").classList.toggle("list-mode",list);
  $("#listWrap").classList.toggle("open",list);
  $("#albumViewBtn").classList.toggle("active",!list);
  $("#listViewBtn").classList.toggle("active",list);
}

function payload(c){
  return {
    code:c.code,card_no:c.card_no,name_ko:c.name_ko,rarity:c.rarity,variant:c.variant,finish:c.finish,
    image_url:c.image_url||"",total_qty:Number(c.total_qty||0),sell_qty:saleQty(c),sell_price:Number(c.sell_price||0),
    north_america_price:Number(c.north_america_price||0),binder_owned:!!c.binder_owned,
    sale_enabled:!!c.sale_enabled,
    sort_no:Number(c.sort_no||9999),updated_at:new Date().toISOString()
  };
}
async function saveCodes(codes,silent=true){
  const rows=cards.filter(c=>codes.includes(c.code)).map(payload);
  if(!rows.length)return true;
  $("#autosaveStatus").textContent="저장중…";
  const {error}=await S.from("cards").upsert(rows,{onConflict:"code"});
  if(error){
    $("#autosaveStatus").textContent="저장 실패";
    if(!silent)alert(error.message);
    return false;
  }
  rows.forEach(r=>{
    dirty.delete(r.code);
    const c=cards.find(x=>x.code===r.code);
    if(c)original[r.code]=JSON.parse(JSON.stringify(c));
  });
  $("#autosaveStatus").textContent="저장완료";
  render();
  return true;
}
function queueSave(code,delay=400){
  dirty.add(code);
  $("#autosaveStatus").textContent="저장 대기";
  clearTimeout(autosaveTimer);
  autosaveTimer=setTimeout(()=>saveCodes([...dirty],true),delay);
}

function updateCardFromAlbum(e){
  const art=e.target.closest(".card");if(!art)return;
  const c=cards.find(x=>x.code===art.dataset.code);if(!c)return;
  if(e.target.classList.contains("pricei"))c.sell_price=u2k(e.target.value);
  else return;
  queueSave(c.code,400);render();
}
$("#cards").addEventListener("change",updateCardFromAlbum);
$("#cards").addEventListener("click",e=>{
  const art=e.target.closest(".card");if(!art)return;
  const c=cards.find(x=>x.code===art.dataset.code);if(!c)return;
  if(e.target.classList.contains("minus"))c.total_qty=Math.max(0,Number(c.total_qty||0)-1);
  else if(e.target.classList.contains("plus"))c.total_qty=Number(c.total_qty||0)+1;
  else return;
  queueSave(c.code,50);render();
});

function updateCardFromList(e){
  const tr=e.target.closest("tr[data-code]");if(!tr)return;
  const c=cards.find(x=>x.code===tr.dataset.code);if(!c)return;
  if(e.target.classList.contains("l-sale"))c.sale_enabled=e.target.checked;
  else if(e.target.classList.contains("l-qty"))c.total_qty=Math.max(0,Number(e.target.value||0));
  else if(e.target.classList.contains("l-price"))c.sell_price=u2k(e.target.value);
  else return;
  queueSave(c.code,400);render();
}
$("#listBody").addEventListener("change",updateCardFromList);
$("#listBody").addEventListener("input",e=>{
  if(e.target.classList.contains("l-price")||e.target.classList.contains("l-qty")){
    const tr=e.target.closest("tr[data-code]");if(!tr)return;
    const c=cards.find(x=>x.code===tr.dataset.code);if(!c)return;
    if(e.target.classList.contains("l-price"))c.sell_price=u2k(e.target.value);
    if(e.target.classList.contains("l-qty"))c.total_qty=Math.max(0,Number(e.target.value||0));
    dirty.add(c.code);
    $("#autosaveStatus").textContent="저장 대기";
    clearTimeout(autosaveTimer);
    autosaveTimer=setTimeout(()=>saveCodes([...dirty],true),600);
    stats(filtered());
  }
});
$("#listBody").addEventListener("click",e=>{
  const tr=e.target.closest("tr[data-code]");if(!tr)return;
  const c=cards.find(x=>x.code===tr.dataset.code);if(!c)return;
  if(e.target.classList.contains("l-minus"))c.total_qty=Math.max(0,Number(c.total_qty||0)-1);
  else if(e.target.classList.contains("l-plus"))c.total_qty=Number(c.total_qty||0)+1;
  else return;
  queueSave(c.code,50);render();
});

$("#manageToggle").onclick=()=>{
  const open=$("#managePanel").classList.toggle("open");
  $("#manageToggle").textContent=open?"관리 메뉴 닫기":"관리 메뉴 열기";
};
$("#albumViewBtn").onclick=()=>{viewMode="album";localStorage.setItem("riftbound_admin_view",viewMode);applyViewMode()};
$("#listViewBtn").onclick=()=>{viewMode="list";localStorage.setItem("riftbound_admin_view",viewMode);applyViewMode()};
$("#fx").onchange=()=>{fx=Math.max(500,Number($("#fx").value||1400));localStorage.setItem("riftbound_admin_fx",String(fx));render()};
$("#saveBtn").onclick=async()=>{if(!dirty.size)return alert("변경된 항목이 없어.");const ok=await saveCodes([...dirty],false);if(ok)alert("저장 완료")};

const ce=v=>`"${String(v??"").replace(/"/g,'""')}"`;
$("#exportBtn").onclick=()=>{
  const a=filtered(),r=[["카드번호","카드명","레어도","유형","피니시","판매노출","전체보유수량","판매가능수량","판매가격(원)","북미가격(원)","현재보유가치(원)"]];
  a.forEach(c=>r.push([c.card_no,c.name_ko,c.rarity,c.variant,c.finish,c.sale_enabled?"Y":"N",c.total_qty,saleQty(c),c.sell_price,naKrw(c),cv(c)]));
  const csv="\uFEFF"+r.map(x=>x.map(ce).join(",")).join("\n");
  const l=document.createElement("a");l.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));l.download=`origins_admin_filtered_${new Date().toISOString().slice(0,10)}.csv`;l.click();URL.revokeObjectURL(l.href);
};

$("#bulkToggle").onclick=()=>$("#bulk").classList.toggle("open");
$("#bulkCond").onchange=()=>$("#rangeRow").style.display=$("#bulkCond").value==="range"?"grid":"none";
function bm(p){
  const c=$("#bulkCond").value;
  if(c==="all")return true;
  if(c==="range"){const a=u2k($("#bulkMin").value),b=u2k($("#bulkMax").value);return p>=a&&p<=b}
  const x=u2k($("#bulkFrom").value);
  return c==="equal"?p===x:c==="lte"?p<=x:c==="gte"?p>=x:false;
}
function bt(){
  const f=$("#bulkFin").value;
  return filtered().filter(c=>{
    if(f==="NORMAL"||f==="FOIL")return c.finish===f;
    if(f==="visible"&&$("#finish").value)return c.finish===$("#finish").value;
    return true;
  });
}
$("#bulkApply").onclick=async()=>{
  const t=u2k($("#bulkTo").value);if(t<=0)return alert("변경가를 입력해줘.");
  const changed=[];
  bt().forEach(c=>{if(bm(Number(c.sell_price||0))){c.sell_price=t;dirty.add(c.code);changed.push(c.code)}});
  render();
  if(changed.length)await saveCodes(changed,true);
  $("#bulkStatus").textContent=`${changed.length}개 변경 및 저장 완료`;
};
$("#bulkUndo").onclick=async()=>{
  const changed=[];
  bt().forEach(c=>{const o=original[c.code];if(o&&bm(Number(c.sell_price||0))){c.sell_price=o.sell_price;dirty.add(c.code);changed.push(c.code)}});
  render();
  if(changed.length)await saveCodes(changed,true);
  $("#bulkStatus").textContent=`${changed.length}개 마지막 저장값으로 복원`;
};

["q","rarity","own","variant","finish","sort"].forEach(id=>$("#"+id).addEventListener(id==="q"?"input":"change",render));

check();

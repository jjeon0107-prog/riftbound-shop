<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>일반카드 부족 재고 사진 정리 · 오리진 카드샵</title>
<style>
:root{--ink:#142036;--muted:#64748b;--blue:#285fdf;--line:#e3e9f4;--bg:#f3f6fb}
*{box-sizing:border-box}
html{min-height:100%;height:auto;overflow-y:auto;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;height:auto;overflow-y:auto;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;-webkit-overflow-scrolling:touch}
button,input,select{font:inherit}
a{color:#1d4ed8}
.shell{width:min(1220px,100%);margin:0 auto;padding:0 16px 40px}
.bar{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line);box-shadow:0 3px 20px rgba(28,48,90,.04)}
.bar .shell{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:11px;padding-bottom:11px}
.brand{display:flex;align-items:center;gap:9px;min-width:0;font-weight:950;font-size:14px;letter-spacing:-.3px}
.brand-icon{display:grid;place-items:center;width:32px;height:32px;flex:none;border-radius:10px;background:#dce7ff;color:#204db6}
.back{flex:none;padding:9px 11px;border:1px solid #cbd8ee;border-radius:10px;text-decoration:none;font-size:12px;font-weight:850;background:#fff}
.intro{padding:24px 0 16px}
.intro h1{font-size:clamp(22px,4.8vw,30px);line-height:1.25;letter-spacing:-.6px;margin:6px 0 7px}
.intro p{font-size:13px;color:var(--muted);line-height:1.6;margin:0}
.pill{display:inline-block;font-size:11px;font-weight:950;letter-spacing:.2px;color:#2b56a7;background:#dbe9ff;border-radius:999px;padding:5px 10px}
.filters{display:grid;grid-template-columns:135px minmax(200px,1fr) minmax(190px,1fr) auto;align-items:end;gap:12px;padding:15px;background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:0 5px 22px rgba(22,41,79,.035)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0;font-size:12px;font-weight:850;color:#475569}
.field input,.field select{height:43px;width:100%;min-width:0;padding:0 12px;border:1px solid #cad5e5;border-radius:9px;color:var(--ink);background:#fff;font-size:14px;outline-offset:2px}
.field input:focus,.field select:focus{outline:2px solid #a4c3ff;border-color:var(--blue)}
.options{display:flex;align-items:center;gap:12px;justify-content:flex-end;flex-wrap:wrap;padding-bottom:4px}
.check{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:12px;font-weight:850;color:#42516a;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--blue)}
.secondary{border:1px solid #cbd5e1;border-radius:9px;background:#fff;padding:11px 12px;color:#334155;font-size:12px;font-weight:850;white-space:nowrap;cursor:pointer}
.status{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:15px 0 13px;padding:13px 15px;border-radius:12px;background:#e7f0ff;border:1px solid #cddfff;color:#1e4786}
.status strong{font-size:15px;line-height:1.5}
.status small{display:block;font-size:11px;color:#526b91;margin-top:2px}
.progress{height:8px;border-radius:999px;overflow:hidden;background:#c9dbf6;width:min(175px,24vw);flex:none}
.progress > span{display:block;height:100%;width:0;background:#3a79ee;transition:width .2s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(174px,1fr));gap:13px;align-content:start}
.item{display:flex;flex-direction:column;min-width:0;overflow:hidden;text-align:left;padding:0;border:1px solid #d9e3f2;border-radius:13px;background:white;box-shadow:0 5px 16px rgba(33,56,95,.04);cursor:pointer;position:relative;touch-action:manipulation}
.item:focus-visible{outline:3px solid #74a3fa;outline-offset:3px}
.item.selected{background:#edfcf5;border-color:#7bdfb3}
.picture{position:relative;display:flex;align-items:center;justify-content:center;background:#eaf0f8;overflow:hidden;aspect-ratio:744/1040}
.picture img{display:block;width:100%;height:100%;object-fit:contain}
.picture-fallback{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;text-align:center;color:#65748a;gap:8px;font-size:12px;font-weight:800;line-height:1.5}
.picture-fallback em{font-style:normal;font-size:26px}
.num{position:absolute;top:8px;left:8px;z-index:1;color:white;background:rgba(15,30,53,.89);border-radius:6px;padding:5px 7px;font-size:11px;font-weight:950;letter-spacing:.2px}
.found{position:absolute;top:8px;right:8px;z-index:1;padding:5px 7px;background:#087b56;border-radius:6px;color:white;font-weight:950;font-size:11px}
.item.selected .picture img{filter:grayscale(.7);opacity:.55}
.info{display:flex;flex-direction:column;gap:5px;flex:1;padding:10px}
.name{font-size:13px;font-weight:950;line-height:1.35;word-break:keep-all;min-height:34px}
.meta{font-size:10px;color:#64748b;font-weight:750}
.qty{display:flex;align-items:baseline;justify-content:space-between;gap:6px;flex-wrap:wrap;margin-top:auto;padding:8px 9px;border-radius:8px;background:#eef4ff;font-size:11px;font-weight:800;color:#425775}
.qty b{font-size:18px;color:#1f4f9e;font-variant-numeric:tabular-nums}
.item.selected .qty{background:#d8f8e9}
.action{display:block;text-align:center;margin-top:4px;padding:9px 5px;background:#e1edff;color:#234fb0;border-radius:7px;font-size:11px;font-weight:950}
.item.selected .action{background:#bbefd8;color:#056b48}
.empty{grid-column:1/-1;padding:60px 12px;background:white;border:1px dashed #bbc9e1;border-radius:12px;text-align:center;color:#64748b;line-height:1.7;font-size:13px}
.message{padding:35px 16px;background:white;border:1px solid var(--line);border-radius:12px;text-align:center;line-height:1.8;font-size:14px;color:#43506a}
.notice{font-size:11px;line-height:1.8;color:#6b7890;margin:23px 2px 0}
[hidden]{display:none!important}
@media(max-width:760px){
 .shell{padding-left:11px;padding-right:11px}
 .intro{padding:18px 0 13px}
 .filters{grid-template-columns:minmax(0,100px) minmax(0,1fr);gap:10px;padding:11px;border-radius:12px}
 .filters .search-field{grid-column:1/-1}
 .options{grid-column:1/-1;justify-content:space-between;gap:7px;padding:2px 0 0}
 .field input,.field select{font-size:13px;height:42px;padding:0 9px}
 .field{font-size:11px}
 .status{margin:12px 0 10px;padding:11px 12px}
 .status strong{font-size:12px}
 .status small{font-size:10px}
 .progress{width:80px}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
 .info{padding:8px;gap:4px}
 .name{font-size:12px;min-height:32px}
 .qty{padding:6px;gap:2px;font-size:10px}
 .qty b{font-size:16px}
 .num{top:6px;left:6px;font-size:10px}
 .action{padding:8px 2px;font-size:10px}
 .intro p{font-size:12px}
}
</style>
</head>
<body>
<header class="bar"><div class="shell"><div class="brand"><span class="brand-icon">🃏</span><span>오리진 카드샵 <span style="color:#64748b;font-weight:700">/ 재고 정리</span></span></div><a class="back" href="admin.html">← 관리자 돌아가기</a></div></header>
<main class="shell">
<section class="intro"><span class="pill">C / U · NORMAL · STANDARD</span><h1>📦 부족 재고 카드 사진 정리</h1><p>필요한 카드만 사진으로 빠르게 찾으세요. 사진을 누르면 ‘찾음’으로 체크됩니다.<br>모바일에서도 아래로 계속 스크롤할 수 있어요.</p></section>
<section class="filters" aria-label="정리 대상 필터">
<label class="field">기준 장수 이하<input id="limit" type="number" min="0" max="999" step="1" value="5" inputmode="numeric"></label>
<label class="field">수량 기준<select id="basis"><option value="sale">판매가능 (보관 1장 제외)</option><option value="total">전체 보유수량</option></select></label>
<label class="field search-field">카드번호 · 이름 검색<input id="search" type="search" placeholder="예: OGN-021 또는 카드명" autocomplete="off"></label>
<div class="options"><label class="check"><input id="remaining" type="checkbox">미정리만 보기</label><button class="secondary" id="reset" type="button">체크 초기화</button><button class="secondary" id="reload" type="button">↻ 갱신</button></div>
</section>
<div class="status" id="status" aria-live="polite">목록 준비 중…</div>
<div class="message" id="message" hidden></div>
<section class="grid" id="grid" aria-label="부족 재고 카드 사진 목록"></section>
<p class="notice">※ 이 목록은 실물 카드를 찾아내기 위한 체크리스트입니다. 체크만으로 재고 수량·판매가는 바뀌지 않습니다. 수량 수정은 기존 관리자 페이지에서 해주세요.<br>정리 체크는 같은 브라우저에 저장되어 새 탭을 열어도 유지됩니다.</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=20261003-2"></script>
<script>(function stockPickerMain(){
  "use strict";
  const $=id=>document.getElementById(id);
  const refs={limit:$("limit"),basis:$("basis"),search:$("search"),remaining:$("remaining"),status:$("status"),progress:$("progress"),grid:$("grid"),message:$("message")};
  const keyDone="riftbound_stock_picker_checked_v2";
  const keyLimit="riftbound_stock_picker_limit";
  const keyBasis="riftbound_stock_picker_basis";
  const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  let cards=[],done=new Set(),loading=false;
  function readStorage(){
    try{
      const v=JSON.parse(localStorage.getItem(keyDone)||"null");
      if(Array.isArray(v)){done=new Set(v.map(String));}
      else {
        const old=JSON.parse(sessionStorage.getItem("riftbound_stock_picker_checked_v1")||"[]");
        if(Array.isArray(old))done=new Set(old.map(String));
        saveDone();
      }
      const lim=localStorage.getItem(keyLimit);
      if(lim!==null&&Number.isSafeInteger(Number(lim))&&Number(lim)>=0&&Number(lim)<=999)refs.limit.value=lim;
      refs.basis.value=localStorage.getItem(keyBasis)==="total"?"total":"sale";
    }catch{ /* private browsing may restrict storage */ }
  }
  function saveDone(){try{localStorage.setItem(keyDone,JSON.stringify([...done]));}catch{}}
  function isCU(c){return ["common","uncommon","커먼","언커먼","c","u"].includes(String(c.rarity||"").trim().toLowerCase())}
  function stock(c){return Math.max(0,Number(c.total_qty??c.sell_qty??0)||0)}
  function sale(c){return Math.max(0,stock(c)-(c.sale_enabled?0:1))}
  function count(c){return refs.basis.value==="total"?stock(c):sale(c)}
  function maxLimit(){return Math.min(999,Math.max(0,Math.trunc(Number(refs.limit.value)||0)))}
  function filtered(){
    const limit=maxLimit(),q=refs.search.value.trim().toLocaleLowerCase("ko-KR");
    return cards.filter(c=>isCU(c)
      &&String(c.finish||"").trim().toUpperCase()==="NORMAL"
      &&String(c.variant||"Standard").trim().toLowerCase()==="standard"
      &&!c.stock_many&&count(c)<=limit
      &&(!q||`${c.code||""} ${c.card_no||""} ${c.name_ko||""} ${c.name_en||""}`.toLocaleLowerCase("ko-KR").includes(q))
    ).sort((a,b)=>String(a.card_no||a.code||"").localeCompare(String(b.card_no||b.code||""),"en",{numeric:true,sensitivity:"base"}));
  }
  function imageUrls(c){
    const urls=[];
    if(/^https:\/\//i.test(String(c.image_url||"").trim()))urls.push(String(c.image_url).trim());
    const id=String(c.card_no||c.code||"").match(/OGN-([0-9]{3})(?:[\/\-]|$)/i);
    if(id){
      const n=id[1];
      urls.push(`https://d3a8eduw4bm8.cloudfront.net/riftbound/cards/ogn/${n}-kr.webp`);
      urls.push(`https://d3a8eduw4bm8.cloudfront.net/riftbound/cards/ogn/${n}-en.webp`);
    }
    return [...new Set(urls)];
  }
  function cardHtml(c,i){
    const code=String(c.code||""),checked=done.has(code),urls=imageUrls(c);
    const img=urls.length
      ?`<img src="${esc(urls[0])}" data-other="${esc(JSON.stringify(urls.slice(1)))}" alt="${esc(c.name_ko||c.card_no||"카드 사진")}" loading="${i<30?"eager":"lazy"}" decoding="async">`
      :'<span class="picture-fallback"><em>🃏</em>등록된 이미지가 없어요</span>';
    return `<button class="item${checked?" selected":""}" type="button" data-code="${esc(code)}" aria-pressed="${checked}">
      <span class="picture">${img}
        <span class="num">${esc(c.card_no||code)}</span>
        ${checked?'<span class="found">✓ 찾음</span>':""}
      </span>
      <span class="info">
        <span class="name">${esc(c.name_ko||"이름 미등록")}</span>
        <span class="meta">${esc(c.rarity||"")} · NORMAL</span>
        <span class="qty"><span>${refs.basis.value==="sale"?"판매가능":"전체 보유"}</span><b>${count(c)}장</b></span>
        <span class="action">${checked?"✓ 정리 완료 · 다시 누르면 해제":"사진 터치 → 찾음 체크"}</span>
      </span>
    </button>`;
  }
  function updateStats(matched){
    const checked=matched.filter(c=>done.has(String(c.code))).length;
    refs.status.innerHTML=`<div><strong>정리 대상 ${matched.length}종 · 완료 ${checked}종 · 남은 ${matched.length-checked}종</strong><small>${refs.basis.value==="sale"?"판매가능 수량":"전체 보유수량"} ${maxLimit()}장 이하 · 카드번호순</small></div>`;
    const bar=document.createElement("div");bar.className="progress";bar.setAttribute("role","progressbar");bar.setAttribute("aria-label","정리 진행률");bar.setAttribute("aria-valuemin","0");bar.setAttribute("aria-valuemax",String(matched.length));bar.setAttribute("aria-valuenow",String(checked));
    bar.innerHTML=`<span style="width:${matched.length?checked/matched.length*100:0}%"></span>`;
    refs.status.appendChild(bar);
  }
  function render(){
    const matched=filtered(),shown=refs.remaining.checked?matched.filter(c=>!done.has(String(c.code))):matched;
    updateStats(matched);
    refs.grid.innerHTML=shown.length?shown.map(cardHtml).join(""):`<div class="empty">${matched.length?"모두 찾았어요! 정리 완료 ✅":"조건에 맞는 일반카드가 없어요."}<br>기준 장수 또는 검색어를 바꿔보세요.</div>`;
  }
  function setMessage(s){refs.message.hidden=false;refs.grid.hidden=true;refs.status.hidden=true;refs.message.innerHTML=s}
  function clearMessage(){refs.message.hidden=true;refs.grid.hidden=false;refs.status.hidden=false}
  async function refresh(){
    if(loading)return;loading=true;$("reload").disabled=true;
    setMessage("재고 목록을 불러오는 중입니다…");
    try{
      if(!window.supabase||!window.RIFTBOUND_CONFIG)throw new Error("필요한 설정을 불러오지 못했습니다. 페이지를 새로고침해 주세요.");
      const cfg=window.RIFTBOUND_CONFIG;
      const client=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
      const {data:auth,error:authErr}=await client.auth.getUser();
      if(authErr||!auth?.user){
        setMessage('관리자 로그인 후 사용할 수 있습니다.<br><a href="admin.html">관리자 페이지에서 로그인하기 →</a>');
        return;
      }
      const {data,error}=await client.from("cards").select("*").order("sort_no",{ascending:true});
      if(error)throw error;
      cards=(data||[]).map(c=>({...c,stock_many:Boolean(c.stock_many),sale_enabled:Boolean(c.sale_enabled??(Number(c.sell_qty||0)>0))}));
      clearMessage();
      render();
    }catch(err){setMessage(`목록을 불러오지 못했습니다.<br><small>${esc(err.message||String(err))}</small><br><a href="admin.html">관리자 페이지로 돌아가기 →</a>`);}
    finally{loading=false;$("reload").disabled=false}
  }
  refs.grid.addEventListener("error",e=>{
    const img=e.target;
    if(!img.matches||!img.matches(".picture img"))return;
    let others=[];try{others=JSON.parse(img.dataset.other||"[]")}catch{}
    if(others.length){img.dataset.other=JSON.stringify(others.slice(1));img.src=others[0];return}
    const fallback=document.createElement("span");
    fallback.className="picture-fallback";fallback.innerHTML="<em>🃏</em>이미지 확인 불가<br>카드번호와 이름으로 구분해 주세요";
    img.replaceWith(fallback);
  },true);
  refs.grid.addEventListener("click",e=>{
    const item=e.target.closest(".item");if(!item)return;
    const code=item.dataset.code;
    if(done.has(code))done.delete(code);else done.add(code);
    saveDone();
    if(refs.remaining.checked){render();return}
    const checked=done.has(code);
    item.classList.toggle("selected",checked);
    item.setAttribute("aria-pressed",String(checked));
    const found=item.querySelector(".found");
    if(found)found.remove();
    if(checked){const badge=document.createElement("span");badge.className="found";badge.textContent="✓ 찾음";item.querySelector(".picture").appendChild(badge)}
    item.querySelector(".action").textContent=checked?"✓ 정리 완료 · 다시 누르면 해제":"사진 터치 → 찾음 체크";
    updateStats(filtered());
  });
  refs.limit.addEventListener("input",()=>{localStorage.setItem(keyLimit,String(maxLimit()));render()});
  refs.basis.addEventListener("change",()=>{localStorage.setItem(keyBasis,refs.basis.value);render()});
  refs.search.addEventListener("input",render);
  refs.remaining.addEventListener("change",render);
  $("reset").addEventListener("click",()=>{
    const target=filtered().filter(c=>done.has(String(c.code)));
    if(!target.length)return;
    if(!confirm(`현재 조건의 정리 체크 ${target.length}종을 모두 지울까요?`))return;
    target.forEach(c=>done.delete(String(c.code)));saveDone();render();
  });
  $("reload").addEventListener("click",refresh);
  readStorage();refresh();
})();</script>
</body>
</html>

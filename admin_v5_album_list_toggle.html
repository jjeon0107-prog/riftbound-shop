<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>오리진 관리자</title><link rel="stylesheet" href="style.css"><style>
body{margin:0;background:#f7f7f8;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#171717}.wrap{max-width:1150px;margin:auto;padding:10px}.top{position:sticky;top:0;z-index:30;background:#f7f7f8f5;border-bottom:1px solid #e7e7ea}.head{max-width:1150px;margin:auto;padding:10px}.hidden{display:none!important}.panel,.card,.stat{background:#fff;border:1px solid #e7e7ea;border-radius:10px}.panel{padding:8px;margin-bottom:8px}.sub{font-size:10px;color:#707077}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:6px}.stat{padding:7px}.stat b{display:block;font-size:14px}.stat span{font-size:9px;color:#707077}.toolbar{display:grid;grid-template-columns:2fr repeat(5,1fr);gap:4px}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:5px}input,select,button{border:1px solid #e7e7ea;background:#fff;border-radius:7px;padding:7px;font-size:11px;min-width:0}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.card{overflow:hidden}.card.dirty{outline:2px solid #f59e0b}.img{width:100%;aspect-ratio:5/7;object-fit:cover;background:#eee}.body{padding:7px}.name{font-size:12px;font-weight:750}.meta,.tiny{font-size:9px;color:#707077}.price{font-size:15px;font-weight:800;margin-top:4px}.ctrl{display:grid;grid-template-columns:auto 1fr;gap:4px;margin-top:5px;align-items:center}.qty{display:grid;grid-template-columns:28px 1fr 28px;gap:3px}.qty input{text-align:center}.edit{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:4px}.bulk{display:none;border-top:1px solid #e7e7ea;margin-top:6px;padding-top:6px}.bulk.open{display:block}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:4px}.grid3{display:grid;grid-template-columns:1fr auto auto;gap:4px;margin-top:4px}@media(max-width:850px){.cards{grid-template-columns:repeat(2,1fr)}.toolbar{grid-template-columns:1fr 1fr 1fr}.toolbar #q{grid-column:1/-1}.actions{grid-template-columns:1fr 1fr}}

<style>

<style>

</head><body>
<header class="top"><div class="head"><h1 style="font-size:18px;margin:0">오리진 카드샵 관리자</h1><div class="sub">오프라인 도감 방식 + 자동 저장 · 북미가는 기준환율 1,400원 대비 환율만 반영</div>
<div id="login" class="panel" style="margin-top:6px"><div style="display:grid;grid-template-columns:1fr 1fr auto;gap:4px"><input id="email" type="email" placeholder="이메일"><input id="password" type="password" placeholder="비밀번호"><button id="loginBtn">로그인</button></div><div id="loginMsg" class="sub"></div></div>
<div id="adminTop" class="hidden">
<div class="stats">
<div class="stat"><b id="sOwned">0</b><span>바인더 보유</span></div><div class="stat"><b id="sSaleQty">0</b><span>판매가능 수량</span></div><div class="stat"><b id="sTotal">₩0</b><span>총 보유가치</span></div>
<div class="stat"><b id="sSaleVal">₩0</b><span>판매재고 가치</span></div><div class="stat"><b id="sFiltered">0</b><span>필터 카드</span></div><div class="stat"><b id="sFilteredVal">₩0</b><span>필터 보유가치</span></div>
</div>
<div class="panel" style="margin-top:6px">
<div class="admin-search-row">

</div>

    <select id="rarity"><option value="">전체 레어도</option></select>
    <select id="own">

</div>
<div class="actions"><button id="saveBtn">수동 저장</button><button id="exportBtn">현재 필터 CSV</button><button id="bulkToggle">필터 일괄가격</button><button id="logoutBtn">로그아웃</button></div>
<div class="view-switch">
  <button id="albumViewBtn" class="active">앨범보기</button>
  <button id="listViewBtn">목록보기</button>
</div><div id="autosaveStatus" class="sub" style="margin-top:5px">자동 저장 ON</div>
<div id="bulk" class="bulk"><div class="grid2"><select id="bulkCond"><option value="equal">현재가가 정확히</option><option value="lte">현재가 이하</option><option value="gte">현재가 이상</option><option value="range">현재가 범위</option><option value="all">현재가 무관</option></select><select id="bulkFin"><option value="visible">현재 피니시 필터 기준</option><option value="NORMAL">NORMAL만</option><option value="FOIL">FOIL만</option><option value="both">둘 다</option></select></div><div class="grid2"><input id="bulkFrom" type="number" step=".1" placeholder="현재가 (1=100원)"><input id="bulkTo" type="number" step=".1" placeholder="변경가 (1=100원)"></div><div id="rangeRow" class="grid2" style="display:none"><input id="bulkMin" type="number" step=".1" placeholder="범위 최소"><input id="bulkMax" type="number" step=".1" placeholder="범위 최대"></div><div class="grid3"><div id="bulkStatus" class="sub">현재 필터에만 적용</div><button id="bulkApply">적용</button><button id="bulkUndo">복원</button></div></div>
</div></div></div></header>
<main class="wrap"><div id="settings" class="panel hidden"><div style="display:grid;grid-template-columns:1fr 1fr auto;gap:4px"><input id="kakao" placeholder="카카오 오픈채팅 URL"><input id="store" placeholder="판매페이지 이름"><button id="saveSettings">설정 저장</button></div><input id="notice" style="width:100%;margin-top:5px" placeholder="판매페이지 안내문"></div><div id="cards" class="cards"></div>
<div id="listWrap" class="list-wrap">
  <table class="list-table">
    <thead>
      <tr>
        <th>번호</th>
        <th>카드명</th>
        <th>피니시</th>
        <th>보유</th>
        <th>판매수량</th>
        <th>판매가</th>
        <th>북미가</th>
        <th>보유가치</th>
      </tr>
    </thead>
    <tbody id="listBody"></tbody>
  </table>
</div>
<div style="height:80px"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const C=window.RIFTBOUND_CONFIG,S=window.supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY);let cards=[],original={},dirty=new Set();const $=s=>document.querySelector(s),won=n=>"₩"+Math.round(Number(n||0)).toLocaleString("ko-KR"),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])),u2k=v=>Math.max(0,Math.round(Number(v||0)*100)),k2u=v=>Number(v||0)?Number(v)/100:"";
function imgs(c){let a=[];if(c.image_url)a.push(c.image_url);const m=String(c.card_no||"").match(/OGN-([0-9]{3}[a-z]?|[0-9]{3}\*)/i);if(m){let r=m[1].toLowerCase();if(r.endsWith("*")){let n=r.replace("*","");a.push(`https://d3a8eduw4bm8.cloudfront.net/riftbound/cards/ogn/${n}-star-kr.webp`,`https://d3a8eduw4bm8.cloudfront.net/riftbound/cards/ogn/${n}-signature-kr.webp`,`https://d3a8eduw4bm8.cloudfront.net/riftbound/cards/ogn/${n}-kr.webp`)}else a.push(`https://d3a8eduw4bm8.cloudfront.net/riftbound/cards/ogn/${r}-kr.webp`)}return [...new Set(a)]}
function ni(i){try{let a=JSON.parse(i.dataset.f||"[]");if(!a.length){i.onerror=null;i.style.visibility="hidden";return}i.src=a.shift();i.dataset.f=JSON.stringify(a)}catch{i.style.visibility="hidden"}}
function ih(c){let a=imgs(c);return a.length?`<img class="img" src="${esc(a[0])}" data-f='${esc(JSON.stringify(a.slice(1)))}' onerror="ni(this)" loading="lazy">`:'<div class="img"></div>'}
let viewMode=localStorage.getItem("riftbound_admin_view")||"album";
let fx=Number(localStorage.getItem("riftbound_admin_fx")||1400);
const BASE_FX=1400;
function naKrw(c){
  const base=Number(c.north_america_price||0);
  return Math.round(base*(fx/BASE_FX));
}
const cv=c=>((c.binder_owned?1:0)+Number(c.sell_qty||0))*Number(c.sell_price||0),sv=c=>Number(c.sell_qty||0)*Number(c.sell_price||0);
async function check(){const {data:{session}}=await S.auth.getSession();session?show():hide()}
function hide(){$("#login").classList.remove("hidden");$("#adminTop").classList.add("hidden");$("#settings").classList.add("hidden")}
async function show(){$("#login").classList.add("hidden");$("#adminTop").classList.remove("hidden");$("#settings").classList.remove("hidden");await Promise.all([loadCards(),loadSettings()])}
$("#loginBtn").onclick=async()=>{const {error}=await S.auth.signInWithPassword({email:$("#email").value.trim(),password:$("#password").value});$("#loginMsg").textContent=error?error.message:"로그인 완료";if(!error)show()};$("#logoutBtn").onclick=async()=>{await S.auth.signOut();hide()};
async function loadCards(){const {data,error}=await S.from("cards").select("*").order("sort_no",{ascending:true});if(error)return alert(error.message);cards=(data||[]).map(x=>({...x}));original=Object.fromEntries(cards.map(c=>[c.code,JSON.parse(JSON.stringify(c))]));dirty.clear();buildR();render()}
async function loadSettings(){const {data}=await S.from("shop_settings").select("*").eq("id",1).maybeSingle();if(data){$("#kakao").value=data.kakao_openchat_url||"";$("#store").value=data.store_name||"";$("#notice").value=data.notice||""}}
$("#saveSettings").onclick=async()=>{const {error}=await S.from("shop_settings").upsert({id:1,kakao_openchat_url:$("#kakao").value.trim(),store_name:$("#store").value.trim()||"리프트바운드 오리진 카드샵",notice:$("#notice").value.trim(),updated_at:new Date().toISOString()},{onConflict:"id"});alert(error?error.message:"설정 저장 완료")};
function buildR(){let s=$("#rarity"),v=s.value;s.innerHTML='<option value="">전체 레어도</option>';[...new Set(cards.map(c=>c.rarity).filter(Boolean))].sort().forEach(x=>s.insertAdjacentHTML("beforeend",`<option>${esc(x)}</option>`));s.value=v}
function filtered(){let q=$("#q").value.trim().toLowerCase(),r=$("#rarity").value,o=$("#own").value,v=$("#variant").value,f=$("#finish").value,a=cards.filter(c=>{if(q&&!(`${c.name_ko} ${c.card_no}`.toLowerCase().includes(q)))return false;if(r&&c.rarity!==r)return false;if(o==="owned"&&!c.binder_owned)return false;if(o==="missing"&&c.binder_owned)return false;if(o==="sellable"&&Number(c.sell_qty||0)<1)return false;if(v&&c.variant!==v)return false;if(f&&c.finish!==f)return false;return true});let s=$("#sort").value;if(s==="priceDesc")a.sort((x,y)=>y.sell_price-x.sell_price);else if(s==="priceAsc")a.sort((x,y)=>x.sell_price-y.sell_price);else if(s==="name")a.sort((x,y)=>String(x.name_ko).localeCompare(String(y.name_ko),"ko"));else a.sort((x,y)=>Number(x.sort_no||9999)-Number(y.sort_no||9999));return a}
function stats(a){$("#sOwned").textContent=cards.filter(c=>c.binder_owned).length.toLocaleString();$("#sSaleQty").textContent=cards.reduce((x,c)=>x+Number(c.sell_qty||0),0).toLocaleString();$("#sTotal").textContent=won(cards.reduce((x,c)=>x+cv(c),0));$("#sSaleVal").textContent=won(cards.reduce((x,c)=>x+sv(c),0));$("#sFiltered").textContent=a.length.toLocaleString();$("#sFilteredVal").textContent=won(a.reduce((x,c)=>x+cv(c),0))}
function render(){
  let a=filtered();
  stats(a);

  $("#cards").innerHTML=a.length?a.map(c=>`<article class="card ${dirty.has(c.code)?"dirty":""}" data-code="${esc(c.code)}">${ih(c)}<div class="body"><div class="name">${esc(c.name_ko)}</div><div class="meta">${esc(c.card_no)} · ${esc(c.rarity||"")} · ${esc(c.variant||"Standard")} · ${esc(c.finish)}</div><div class="price">${won(c.sell_price)} <span class="tiny">(북미 ${won(naKrw(c))})</span></div><div class="ctrl"><label class="tiny"><input class="ownc" type="checkbox" ${c.binder_owned?"checked":""}> 보유</label><div class="qty"><button class="minus">−</button><input class="qtyi" type="number" min="0" value="${Number(c.sell_qty||0)}"><button class="plus">＋</button></div></div><div class="edit" style="grid-template-columns:1fr"><input class="pricei" type="number" step=".1" min="0" value="${k2u(c.sell_price)}" placeholder="판매가 1=100원"></div><div class="tiny" style="margin-top:4px">보유가치 ${won(cv(c))} · 판매재고 ${won(sv(c))}</div></div></article>`).join(""):'<div class="panel">조건에 맞는 카드가 없어.</div>';

  $("#listBody").innerHTML=a.length?a.map(c=>`
    <tr class="${dirty.has(c.code)?"dirty":""}" data-code="${esc(c.code)}">
      <td>${esc(c.card_no)}</td>
      <td class="list-name" title="${esc(c.name_ko)}">${esc(c.name_ko)}</td>
      <td>${esc(c.finish)}</td>
      <td><input class="l-own" type="checkbox" ${c.binder_owned?"checked":""}></td>
      <td>
        <div class="list-qty">
          <button class="l-minus">−</button>
          <input class="l-qty" type="number" min="0" value="${Number(c.sell_qty||0)}">
          <button class="l-plus">＋</button>
        </div>
      </td>
      <td><input class="l-price" type="number" step=".1" min="0" value="${k2u(c.sell_price)}"></td>
      <td>${won(naKrw(c))}</td>
      <td>${won(cv(c))}</td>
    </tr>
  `).join(""):'<tr><td colspan="8">조건에 맞는 카드가 없어.</td></tr>';

  applyViewMode();
}

function applyViewMode(){
  const list=viewMode==="list";
  $("#cards").classList.toggle("list-mode",list);
  $("#listWrap").classList.toggle("open",list);
  $("#albumViewBtn").classList.toggle("active",!list);
  $("#listViewBtn").classList.toggle("active",list);
}
$("#cards").addEventListener("change",e=>{let a=e.target.closest(".card");if(!a)return;let c=cards.find(x=>x.code===a.dataset.code);if(!c)return;if(e.target.classList.contains("ownc"))c.binder_owned=e.target.checked;if(e.target.classList.contains("qtyi"))c.sell_qty=Math.max(0,Number(e.target.value||0));if(e.target.classList.contains("pricei"))c.sell_price=u2k(e.target.value);queueAutosave(c.code,500);render()});
$("#cards").addEventListener("click",e=>{let a=e.target.closest(".card");if(!a)return;let c=cards.find(x=>x.code===a.dataset.code);if(!c)return;if(e.target.classList.contains("minus"))c.sell_qty=Math.max(0,Number(c.sell_qty||0)-1);else if(e.target.classList.contains("plus"))c.sell_qty=Number(c.sell_qty||0)+1;else return;queueAutosave(c.code,50);render()});

$("#listBody").addEventListener("change",e=>{
  const tr=e.target.closest("tr[data-code]");if(!tr)return;
  const c=cards.find(x=>x.code===tr.dataset.code);if(!c)return;
  if(e.target.classList.contains("l-own"))c.binder_owned=e.target.checked;
  if(e.target.classList.contains("l-qty"))c.sell_qty=Math.max(0,Number(e.target.value||0));
  if(e.target.classList.contains("l-price"))c.sell_price=u2k(e.target.value);
  queueAutosave(c.code,500);
  render();
});

$("#listBody").addEventListener("click",e=>{
  const tr=e.target.closest("tr[data-code]");if(!tr)return;
  const c=cards.find(x=>x.code===tr.dataset.code);if(!c)return;
  if(e.target.classList.contains("l-minus"))c.sell_qty=Math.max(0,Number(c.sell_qty||0)-1);
  else if(e.target.classList.contains("l-plus"))c.sell_qty=Number(c.sell_qty||0)+1;
  else return;
  queueAutosave(c.code,50);
  render();
});

$("#albumViewBtn").onclick=()=>{
  viewMode="album";
  localStorage.setItem("riftbound_admin_view",viewMode);
  applyViewMode();
};
$("#listViewBtn").onclick=()=>{
  viewMode="list";
  localStorage.setItem("riftbound_admin_view",viewMode);
  applyViewMode();
};


let autosaveTimer=null;
let savingNow=false;

function payloadFor(c){
 return {
   code:c.code,
   card_no:c.card_no,
   name_ko:c.name_ko,
   rarity:c.rarity,
   variant:c.variant,
   finish:c.finish,
   image_url:c.image_url||"",
   sell_qty:Number(c.sell_qty||0),
   sell_price:Number(c.sell_price||0),
   north_america_price:Number(c.north_america_price||0),
   binder_owned:!!c.binder_owned,
   sort_no:Number(c.sort_no||9999),
   updated_at:new Date().toISOString()
 };
}

async function saveCodes(codes, silent=true){
 if(!codes || !codes.length)return;
 const unique=[...new Set(codes)];
 const rows=cards.filter(c=>unique.includes(c.code)).map(payloadFor);
 if(!rows.length)return;

 savingNow=true;
 $("#autosaveStatus").textContent=`저장중… ${rows.length}개`;
 const {error}=await S.from("cards").upsert(rows,{onConflict:"code"});
 savingNow=false;

 if(error){
   $("#autosaveStatus").textContent="자동 저장 실패";
   if(!silent)alert(error.message);
   else console.error(error);
   return false;
 }

 rows.forEach(r=>{
   dirty.delete(r.code);
   const c=cards.find(x=>x.code===r.code);
   if(c)original[r.code]=JSON.parse(JSON.stringify(c));
 });
 $("#autosaveStatus").textContent=`저장완료 · ${new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit",second:"2-digit"})}`;
 render();
 return true;
}

function queueAutosave(code, delay=500){
 dirty.add(code);
 $("#autosaveStatus").textContent="변경 감지 · 자동 저장 대기";
 clearTimeout(autosaveTimer);
 autosaveTimer=setTimeout(()=>saveCodes([...dirty],true),delay);
}

$("#saveBtn").onclick=async()=>{
 if(!dirty.size)return alert("변경된 항목이 없어.");
 const ok=await saveCodes([...dirty],false);
 if(ok)alert("저장 완료");
};

<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSV 변환</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap"><div class="panel"><h2>v22 CSV → Supabase CSV</h2><p class="sub">기존 v22의 '현재 필터 CSV 내보내기' 파일을 선택하세요.</p><input id="file" type="file" accept=".csv"><button id="go">변환</button><div id="msg" class="sub"></div></div></main><script>
function parseCSV(t){const R=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const x=t[i],n=t[i+1];if(x==='"'&&q&&n==='"'){c+='"';i++}else if(x==='"')q=!q;else if(x===','&&!q){r.push(c);c=''}else if((x==='
'||x==='')&&!q){if(x===''&&n==='
')i++;r.push(c);if(r.some(v=>v!==''))R.push(r);r=[];c=''}else c+=x}if(c||r.length){r.push(c);R.push(r)}return R}const esc=v=>'"'+String(v??'').replace(/"/g,'""')+'"';go.onclick=async()=>{const f=file.files[0];if(!f)return alert('CSV를 선택해 주세요.');const rows=parseCSV((await f.text()).replace(/^﻿/,'')),h=rows.shift(),ix=n=>h.indexOf(n),out=[['code','card_no','name_ko','rarity','variant','finish','image_url','sell_qty','sell_price','north_america_price','binder_owned','sort_no']];rows.forEach(r=>{const no=r[ix('카드번호')]||'',fin=r[ix('피니시')]||'NORMAL',code=(no.replace('/298','').replace(/\s.*$/,'')+'-'+fin).replace(/\*/g,'SIG'),num=parseFloat((no.match(/\d+(?:\.\d+)?/)||[9999])[0]);out.push([code,no,r[ix('카드명')]||'',r[ix('레어도')]||'',r[ix('유형')]||'Standard',fin,'',r[ix('판매수량')]||0,r[ix('현재가격(원)')]||0,r[ix('북미가격(원)')]||0,(r[ix('바인더보유')]||'N')==='Y',num+(fin==='FOIL'?0.001:0)])});const csv='﻿'+out.map(r=>r.map(esc).join(',')).join('
'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='supabase_cards_import.csv';a.click();URL.revokeObjectURL(a.href);msg.textContent=`${rows.length}행 변환 완료`};
</script></body></html>

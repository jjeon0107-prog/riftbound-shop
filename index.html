<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>리프트바운드 오리진 카드샵</title>
<link rel="stylesheet" href="style.css">

<style>
.card.soldout{opacity:.72}
.card.soldout .img{filter:grayscale(.28)}
.soldout-badge{
  display:inline-block;
  margin-top:6px;
  padding:4px 7px;
  border-radius:999px;
  background:#ececef;
  color:#666;
  font-size:11px;
  font-weight:700;
}
.buyrow button:disabled{
  opacity:.35;
  cursor:not-allowed;
}

.foil-badge{
  position:absolute;
  top:7px;
  left:7px;
  z-index:5;
  padding:5px 9px;
  border-radius:8px;
  color:#111;
  font-size:10px;
  font-weight:950;
  letter-spacing:.08em;
  border:1px solid rgba(255,255,255,.8);
  background:
    linear-gradient(115deg,
      rgba(255,255,255,.98) 0%,
      rgba(255,205,247,.98) 18%,
      rgba(185,230,255,.98) 36%,
      rgba(255,248,170,.98) 54%,
      rgba(210,188,255,.98) 72%,
      rgba(255,255,255,.98) 100%);
  background-size:220% 220%;
  box-shadow:0 2px 7px rgba(0,0,0,.3), inset 0 0 5px rgba(255,255,255,.9);
  animation:foilShine 2.2s linear infinite;
}
@keyframes foilShine{
  0%{background-position:0% 50%;filter:brightness(1)}
  50%{background-position:100% 50%;filter:brightness(1.2)}
  100%{background-position:0% 50%;filter:brightness(1)}
}

.shop-notice{
  margin:8px 0 10px;
  padding:11px 12px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#fff;
  font-size:13px;
  line-height:1.7;
  font-weight:650;
}
.shop-notice div+div{margin-top:2px}
@media(max-width:800px){
  .shop-notice{
    font-size:12.5px;
    line-height:1.65;
    padding:10px 11px;
  }
}


.last-updated{
  margin:2px 0 7px;
  font-size:11px;
  color:var(--muted);
  font-weight:650;
}
@media(max-width:800px){
  .last-updated{font-size:10.5px}
}


.purchase-guide{
  margin:8px 0 10px;
  padding:11px 12px;
  border:1px solid #dfe6ef;
  border-radius:10px;
  background:linear-gradient(180deg,#f8fbff 0%,#ffffff 100%);
  box-shadow:0 1px 4px rgba(0,0,0,.04);
}
.purchase-guide-title{
  font-size:13px;
  line-height:1.6;
  font-weight:800;
  color:#1f2937;
}
.purchase-guide-notes{
  margin-top:7px;
  padding-top:7px;
  border-top:1px dashed #d8dee8;
  font-size:12.5px;
  line-height:1.7;
  font-weight:650;
  color:#4b5563;
}
.purchase-guide-notes div+div{margin-top:1px}
.purchase-guide-notes .dot{
  color:#2563eb;
  font-weight:900;
}
@media(max-width:800px){
  .purchase-guide{
    padding:10px 11px;
  }
  .purchase-guide-title{
    font-size:12.5px;
  }
  .purchase-guide-notes{
    font-size:12px;
  }
}


.promo-badge{
  position:absolute;
  top:7px;
  right:7px;
  z-index:8;
  padding:4px 8px;
  border-radius:7px;
  background:#111827;
  color:#fff;
  font-size:9px;
  font-weight:950;
  letter-spacing:.06em;
  box-shadow:0 1px 5px rgba(0,0,0,.25);
}
.signature-badge{
  position:absolute;
  top:7px;
  right:7px;
  z-index:7;
  padding:4px 8px;
  border-radius:7px;
  color:#3a2500;
  font-size:9px;
  font-weight:950;
  letter-spacing:.06em;
  border:1px solid rgba(255,245,180,.95);
  background:
    linear-gradient(115deg,
      #fff7bf 0%,
      #d9a928 18%,
      #fff1a8 36%,
      #b87b00 54%,
      #ffe36d 72%,
      #fff8d2 100%);
  background-size:220% 220%;
  box-shadow:0 1px 6px rgba(120,75,0,.35), inset 0 0 5px rgba(255,255,255,.8);
  animation:signatureShine 2.4s linear infinite;
}
@keyframes signatureShine{
  0%{background-position:0% 50%;filter:brightness(1)}
  50%{background-position:100% 50%;filter:brightness(1.18)}
  100%{background-position:0% 50%;filter:brightness(1)}
}


.top .purchase-guide{
  margin:6px 0 0;
  padding:8px 10px;
}
.top .purchase-guide-title{
  font-size:12px;
  line-height:1.45;
}
.top .purchase-guide-notes{
  margin-top:5px;
  padding-top:5px;
  font-size:11px;
  line-height:1.5;
}
@media(max-width:800px){
  .top .purchase-guide{
    margin-top:5px;
    padding:7px 8px;
  }
  .top .purchase-guide-title{font-size:11.5px}
  .top .purchase-guide-notes{font-size:10.5px;line-height:1.45}
}


body.cart-open{
  overflow:hidden!important;
}
.cart-drawer.open{
  display:flex!important;
  align-items:flex-end;
}
.cart-sheet{
  display:flex!important;
  flex-direction:column;
  max-height:88dvh!important;
  height:min(88dvh,760px);
}
.cart-sheet-head,
.cart-footer{
  flex:0 0 auto;
}
.cart-list{
  flex:1 1 auto!important;
  min-height:0!important;
  max-height:none!important;
  overflow-y:auto!important;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
}
@supports not (height: 1dvh){
  .cart-sheet{height:88vh}
}


/* v16 stability override */
.cart-drawer{
  position:fixed!important;
  inset:0!important;
  z-index:9999!important;
}
.cart-drawer:not(.open){
  display:none!important;
}
.cart-drawer.open{
  display:flex!important;
  align-items:flex-end!important;
}
.cart-drawer.open .cart-sheet{
  width:100%!important;
  max-height:88dvh!important;
  display:flex!important;
  flex-direction:column!important;
}
.cart-drawer.open .cart-list{
  flex:1 1 auto!important;
  min-height:80px!important;
  overflow-y:auto!important;
  -webkit-overflow-scrolling:touch;
}


#sortOrder{min-width:132px}
@media(max-width:800px){
  #sortOrder{min-width:0}
}


/* v21 compact sale header */
.compact-top{
  position:sticky;
  top:0;
  z-index:50;
  backdrop-filter:saturate(1.15) blur(10px);
  background:rgba(255,255,255,.96);
  border-bottom:1px solid var(--line);
}
.compact-head{
  padding-top:7px!important;
  padding-bottom:7px!important;
}
.compact-title-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}
.compact-title-row h1{
  margin:0!important;
  font-size:18px!important;
  line-height:1.2!important;
}
.compact-guide{
  position:relative;
  flex:0 0 auto;
}
.compact-guide summary{
  list-style:none;
  cursor:pointer;
  padding:6px 9px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff;
  font-size:11px;
  font-weight:850;
}
.compact-guide summary::-webkit-details-marker{display:none}
.compact-guide-pop{
  position:absolute;
  right:0;
  top:calc(100% + 6px);
  width:min(340px,84vw);
  padding:10px 11px;
  border:1px solid var(--line);
  border-radius:10px;
  background:#fff;
  box-shadow:0 10px 30px rgba(15,23,42,.14);
  font-size:11px;
  line-height:1.55;
}
.compact-status{
  margin:4px 0 5px;
  color:var(--muted);
  font-size:10.5px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.compact-toolbar{
  display:grid!important;
  grid-template-columns:minmax(0,2fr) repeat(5,minmax(0,1fr));
  gap:5px!important;
  margin:0!important;
}
.compact-toolbar input,
.compact-toolbar select{
  min-height:34px!important;
  height:34px!important;
  padding-top:4px!important;
  padding-bottom:4px!important;
  font-size:11px!important;
}
.compact-toolbar input{min-width:0!important}

@media(max-width:800px){
  .compact-head{
    padding:6px 8px!important;
  }
  .compact-title-row h1{
    font-size:16px!important;
  }
  .compact-guide summary{
    padding:5px 7px;
    font-size:10.5px;
  }
  .compact-status{
    margin:3px 0 4px;
    font-size:9.5px;
  }
  .compact-toolbar{
    grid-template-columns:1.55fr 1fr 1fr;
    gap:4px!important;
  }
  .compact-toolbar #q{
    grid-column:1 / -1;
  }
  .compact-toolbar #finish,
  .compact-toolbar #sortOrder{
    min-width:0;
  }
  .compact-toolbar input,
  .compact-toolbar select{
    min-height:32px!important;
    height:32px!important;
    font-size:10.5px!important;
    padding-left:7px!important;
    padding-right:7px!important;
  }
  .last-updated{
    margin-top:4px!important;
  }
}


/* Stock filter sits alongside other filters; unchecked by default. */
.compact-toolbar .available-only-toggle{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  min-width:0;
  height:34px;
  box-sizing:border-box;
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff;
  padding:0 5px;
  cursor:pointer;
  white-space:nowrap;
  font-size:11px;
  font-weight:750;
  color:#28354c;
}
.compact-toolbar .available-only-toggle input{
  width:15px;
  height:15px!important;
  min-height:15px!important;
  padding:0!important;
  margin:0;
  flex:0 0 15px;
  accent-color:#2563eb;
  cursor:pointer;
}
@media(max-width:800px){
  .compact-toolbar .available-only-toggle{
    grid-column:span 2;
    height:32px;
    gap:5px;
    font-size:10.5px;
  }
}
/* v22 deck bundle quick-add */
.deck-shop{
  margin:7px 0 10px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fff;
  padding:9px;
  display:none;
}
.deck-shop.show{display:block}
.deck-shop-head{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.deck-shop-title{font-size:13px;font-weight:950}
.deck-chips{
  display:flex;gap:6px;overflow-x:auto;padding:7px 0 4px;
  scrollbar-width:none;
}
.deck-chips::-webkit-scrollbar{display:none}
.deck-chip{
  flex:0 0 auto;
  border:1px solid var(--line);
  border-radius:999px;
  padding:6px 10px;
  background:#fff;
  font-size:11px;
  font-weight:850;
}
.deck-chip.active{background:#111827;color:#fff;border-color:#111827}
.deck-preview{
  margin-top:4px;
  padding-top:8px;
  border-top:1px dashed var(--line);
}
.deck-preview-name{font-weight:950;font-size:13px}
.deck-preview-desc{font-size:10.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.deck-preview-stats{
  display:flex;flex-wrap:wrap;gap:5px 10px;
  margin-top:7px;font-size:11px;font-weight:850;
}
.deck-preview-missing{
  margin-top:6px;padding:7px 8px;border-radius:8px;
  background:#fff7ed;color:#9a3412;font-size:10.5px;line-height:1.45;
}
.deck-preview-ok{
  margin-top:6px;padding:7px 8px;border-radius:8px;
  background:#ecfdf5;color:#065f46;font-size:10.5px;font-weight:800;
}
.deck-add-btn{
  width:100%;margin-top:7px;min-height:36px;
  background:#111827;color:#fff;border:none;border-radius:9px;font-weight:950;
}
.deck-add-btn:disabled{opacity:.45}
.deck-inline-status{
  margin-top:6px;font-size:10.5px;font-weight:800;color:#065f46;display:none
}
.deck-inline-status.show{display:block}
@media(max-width:800px){
  .deck-shop{margin:5px 0 7px;padding:7px}
  .deck-shop-title{font-size:12px}
  .deck-chip{padding:5px 8px;font-size:10px}
  .deck-preview{padding-top:6px}
}


/* v24 deck groups */
.deck-sections-public{display:grid;gap:7px;margin-top:8px}
.deck-section-public{border:1px solid var(--line);border-radius:9px;padding:7px;background:#fff}
.deck-section-public-title{font-size:10.5px;font-weight:950;margin-bottom:4px}
.deck-section-public-items{display:flex;flex-wrap:wrap;gap:4px 8px}
.deck-section-public-item{font-size:9.5px;color:#475569}
.deck-section-public-item b{color:#111827}


/* v25 compact deck panel */
.compact-deck-shop{padding:7px 8px}
.compact-deck-head{margin-bottom:2px}
.deck-panel-toggle{
  flex:0 0 auto;
  min-height:30px;
  padding:5px 9px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff;
  font-size:10.5px;
  font-weight:900;
}
.compact-deck-chips{padding:5px 0 0}
.compact-deck-chips .deck-chip{padding:5px 9px}
.deck-panel{display:none;margin-top:5px}
.deck-panel.open{display:block}
@media(max-width:800px){
  .compact-deck-shop{padding:6px 7px;margin-bottom:6px}
  .deck-panel-toggle{min-height:28px;padding:4px 8px;font-size:10px}
  .compact-deck-chips{padding-top:4px}
}


/* v26 update time + public sales summary */
.shop-status-strip{
  display:flex;
  align-items:center;
  gap:5px;
  flex-wrap:wrap;
  margin:4px 0 6px;
  padding:5px 8px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#f8fafc;
  font-size:10.5px;
  font-weight:800;
  color:#475569;
}
.shop-status-strip .last-updated{
  margin:0!important;
  padding:0!important;
}
.shop-status-dot{color:#94a3b8}
#publicStockSummary{color:#0f172a}
@media(max-width:800px){
  .shop-status-strip{
    margin:3px 0 5px;
    padding:4px 7px;
    font-size:9.5px;
  }
}


/* v27 grouped buyer cart */
.cart-group{margin:4px 0 10px}
.cart-group-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  padding:7px 4px 5px;
  font-size:11px;
  font-weight:950;
  color:#334155;
  border-bottom:1px solid var(--line);
}
.cart-subgroup-head{
  margin:7px 0 2px;
  padding:4px 7px;
  border-radius:999px;
  background:#eef2f7;
  color:#475569;
  font-size:9.5px;
  font-weight:900;
  display:inline-block;
}


/* v28 bilingual KR/EN */
.lang-switch{
  display:flex;
  align-items:center;
  gap:2px;
  margin-left:auto;
  margin-right:4px;
  padding:2px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff;
  flex:0 0 auto;
}
.lang-switch button{
  border:0;
  background:transparent;
  border-radius:6px;
  padding:4px 7px;
  font-size:10px;
  font-weight:900;
  cursor:pointer;
}
.lang-switch button.active{background:#111827;color:#fff}
@media(max-width:800px){
  .lang-switch button{padding:4px 6px;font-size:9.5px}
}


/* v30 English card names */
.name-en{
  display:block;
  margin-top:2px;
  font-size:10px;
  line-height:1.2;
  font-weight:650;
  color:var(--muted);
}
.cart-name-en{
  display:block;
  margin-top:1px;
  font-size:9px;
  line-height:1.2;
  color:var(--muted);
}

</style>


<style>
/* v4 public shop: soldout overlay + cart drawer */
.card{position:relative}
.card.soldout{opacity:1}
.card.soldout .img{filter:brightness(.42) grayscale(.25)}
.soldout-overlay{
  position:absolute;
  top:38%;
  left:50%;
  transform:translate(-50%,-50%);
  z-index:3;
  padding:7px 13px;
  border-radius:999px;
  background:rgba(0,0,0,.72);
  color:#fff;
  font-size:14px;
  font-weight:800;
  letter-spacing:.08em;
  pointer-events:none;
}
.cartbar .cartinner{
  grid-template-columns:1fr auto auto auto;
}
#cartViewBtn{
  background:#fff;
  color:#111;
}
.cart-drawer{
  position:fixed;
  inset:0;
  z-index:50;
  display:none;
  background:rgba(0,0,0,.38);
}
.cart-drawer.open{display:block}
.cart-sheet{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  max-height:78vh;
  background:#fff;
  border-radius:18px 18px 0 0;
  box-shadow:0 -12px 30px rgba(0,0,0,.16);
  overflow:hidden;
}
.cart-sheet-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:12px 14px;
  border-bottom:1px solid var(--line);
}
.cart-sheet-head h2{
  margin:0;
  font-size:17px;
}
.cart-sheet-head button{
  border:1px solid var(--line);
  background:#fff;
  border-radius:8px;
  padding:7px 10px;
}
.cart-list{
  overflow:auto;
  max-height:52vh;
  padding:8px 12px;
}
.cart-empty{
  padding:35px 10px;
  text-align:center;
  color:var(--muted);
}
.cart-item{
  display:grid;
  grid-template-columns:52px 1fr auto;
  gap:8px;
  align-items:center;
  padding:8px 0;
  border-bottom:1px solid var(--line);
}
.cart-thumb{
  width:52px;
  aspect-ratio:5/7;
  object-fit:cover;
  border-radius:6px;
  background:#eee;
}
.cart-info .cart-name{
  font-size:12px;
  font-weight:750;
  line-height:1.25;
}
.cart-info .cart-meta{
  font-size:9px;
  color:var(--muted);
  margin-top:2px;
}
.cart-info .cart-price{
  font-size:11px;
  font-weight:700;
  margin-top:3px;
}
.cart-actions{
  display:grid;
  grid-template-columns:28px 34px 28px;
  gap:3px;
  align-items:center;
}
.cart-actions button{
  border:1px solid var(--line);
  background:#fff;
  border-radius:6px;
  height:30px;
}
.cart-actions .cart-q{
  text-align:center;
  font-size:11px;
}
.cart-remove{
  grid-column:1/-1;
  font-size:9px;
  color:#a33;
  height:25px!important;
}
.cart-footer{
  padding:10px 12px 14px;
  border-top:1px solid var(--line);
  background:#fafafa;
}
.cart-total{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:14px;
  font-weight:800;
  margin-bottom:8px;
}
.cart-footer-buttons{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:6px;
}
.cart-footer-buttons button{
  border:0;
  border-radius:8px;
  padding:10px 8px;
  font-weight:700;
}
#clearCartBtn{background:#ececef;color:#444}
#drawerCopyBtn{background:#222;color:#fff}
#drawerKakaoBtn{background:#fee500;color:#111}
@media(max-width:800px){
  .cartbar .cartinner{
    grid-template-columns:1fr auto;
  }
  .cartbar .cartinner button{
    width:auto;
  }
  #copyBtn,#kakaoBtn{display:none}
  #cartViewBtn{grid-column:auto}
}
</style>

</head>
<body>

<header class="top compact-top">
  <div class="head compact-head">
    <div class="compact-title-row">
      <h1 id="storeName">리프트바운드 오리진 카드샵</h1>
      <div class="lang-switch" aria-label="Language">
        <button id="langKoBtn" type="button">KR</button>
        <button id="langEnBtn" type="button">EN</button>
      </div>
      <details class="compact-guide">
        <summary id="guideSummary">구매안내</summary>
        <div class="compact-guide-pop">
          <b id="guideMain">원하는 카드를 선택한 뒤 구매목록을 카카오톡으로 보내주세요.</b>
          <div id="guideLine1">• 수량·가격은 수시 업데이트 / 입금순 판매</div>
          <div id="guideLine2">• 포일 이상 슬리브 / 고가 카드 탑로더</div>
          <div id="guideLine3"></div>
          <div id="guideLine4"></div>
        </div>
      </details>
    </div>

    <div class="compact-status">
      <span id="notice">전체 카드 표시 · 0장은 품절</span>
    </div>

    <div class="toolbar compact-toolbar">
      <input id="q" placeholder="카드명 / 번호 검색">
      <select id="rarity"><option value="">전체 레어도</option></select>
      <select id="variant"><option value="">전체 유형</option></select>
      <select id="finish">
        <option value="">NORMAL+FOIL</option>
        <option>NORMAL</option>
        <option>FOIL</option>
      </select>
      <select id="sortOrder">

async function restGet(path){
  const r=await fetch(`${C.SUPABASE_URL}/rest/v1/${path}`,{
    method:"GET",
    headers:{
      "apikey":C.SUPABASE_ANON_KEY,
      "Authorization":`Bearer ${C.SUPABASE_ANON_KEY}`,
      "Accept":"application/json"
    },
    cache:"no-store"
  });
  const text=await r.text();
  let data=null;
  try{data=text?JSON.parse(text):null}catch{data=text}
  if(!r.ok){
    throw new Error(
      (data && (data.message||data.error_description||data.hint)) ||
      `DB 조회 실패 (${r.status})`
    );
  }
  return data;
}

async function restRpc(name,args){
  const r=await fetch(`${C.SUPABASE_URL}/rest/v1/rpc/${name}`,{
    method:"POST",
    headers:{
      "apikey":C.SUPABASE_ANON_KEY,
      "Authorization":`Bearer ${C.SUPABASE_ANON_KEY}`,
      "Content-Type":"application/json",
      "Accept":"application/json"
    },
    body:JSON.stringify(args),
    cache:"no-store"
  });
  const text=await r.text();
  let data=null;
  try{data=text?JSON.parse(text):null}catch{data=text}

    throw new Error(
      (data && (data.message||data.error_description||data.hint)) ||

    );
  }
  return data;
}

function cardImageCandidates(c) {
  const list = [];
  if (c.image_url) list.push(c.image_url);

  const cardNo = String(c.card_no || "");
  const m = cardNo.match(/OGN-([0-9]{3}[a-z]?|[0-9]{3}\*)/i);

  if (m) {
    const raw = m[1].toLowerCase();

    if (raw.endsWith("*")) {
      const n = raw.replace("*", "");
      list.push(`https://d3a8eduw4bm8.cloudfront.net/riftbound/cards/ogn/${n}-star-kr.webp`);
      list.push(`https://d3a8eduw4bm8.cloudfront.net/riftbound/cards/ogn/${n}-signature-kr.webp`);
      list.push(`https://d3a8eduw4bm8.cloudfront.net/riftbound/cards/ogn/${n}-kr.webp`);
      list.push(`https://static.dotgg.gg/riftbound/cards/OGN-${n}-STAR.webp`);
      list.push(`https://static.dotgg.gg/riftbound/cards/OGN-${n}.webp`);
    } else {
      list.push(`https://d3a8eduw4bm8.cloudfront.net/riftbound/cards/ogn/${raw}-kr.webp`);
      list.push(`https://static.dotgg.gg/riftbound/cards/OGN-${raw.toUpperCase()}.webp`);
    }
  }

  return [...new Set(list.filter(Boolean))];
}

function imageHtml(c) {
  const urls = cardImageCandidates(c);
  if (!urls.length) return '<div class="img"></div>';

  const first = esc(urls[0]);
  const rest = esc(JSON.stringify(urls.slice(1)));

  return `<img class="img"
    src="${first}"
    data-fallbacks='${rest}'
    loading="lazy"
    alt="${esc(c.name_ko)}"
    onerror="nextCardImage(this)">`;
}

function nextCardImage(img) {
  try {
    const fallbacks = JSON.parse(img.dataset.fallbacks || "[]");
    if (!fallbacks.length) {
      img.onerror = null;
      img.style.visibility = "hidden";
      return;
    }
    const next = fallbacks.shift();
    img.dataset.fallbacks = JSON.stringify(fallbacks);
    img.src = next;
  } catch (e) {
    img.onerror = null;
    img.style.visibility = "hidden";
  }
}

async function load() {
  cardsEl.innerHTML=`<div class="empty">${T("loading")}</div>`;

  try {
    const data=await restGet(
      "public_cards?select=*&order=sort_no.asc"
    );

    cards=Array.isArray(data)?data:[];

    if(!cards.length){
      throw new Error("카드 데이터가 0건입니다. public_cards 권한/뷰를 확인해 주세요.");
    }

    try{
      const sold=await restRpc("public_sold_counts",{});
      soldCounts=Object.fromEntries(
        (Array.isArray(sold)?sold:[]).map(x=>[x.code,Number(x.sold_qty||0)])
      );
    }catch(e){
      console.warn("판매완료 수량 조회 실패:",e);
      soldCounts={};
    }

    try{
      const decks=await restGet(
        "deck_bundles?select=id,name,description,sort_order&active=eq.true&order=sort_order.asc,id.asc"
      );

      const items=await restGet(
        "deck_bundle_items?select=deck_id,code,qty,sort_order,section&order=sort_order.asc,id.asc"
      );

      const cardMap=Object.fromEntries(cards.map(c=>[c.code,c]));

      deckBundles=(Array.isArray(decks)?decks:[]).map(d=>({
        ...d,
        items:(Array.isArray(items)?items:[])
          .filter(x=>Number(x.deck_id)===Number(d.id))
          .map(x=>{
            const c=cardMap[x.code]||{};
            return {
              ...x,
              card_no:c.card_no||x.code,
              name_ko:c.name_ko||"",
              rarity:c.rarity||"",
              variant:c.variant||"",
              finish:c.finish||"",
              image_url:c.image_url||"",
              sell_price:Number(c.sell_price||0),
              stock_many:Boolean(c.stock_many),
              available_qty:Boolean(c.stock_many)
                ? 999999
                : Math.max(0,Number(c.sell_qty||0))
            };
          })
      }));

      if(deckBundles.length){
        selectedDeckId=deckBundles[0].id;
      }
      renderDeckShop();
    }catch(e){
      console.warn("추천 덱 조회 실패:",e);
      deckBundles=[];
      renderDeckShop();
    }

    buildFilters();
    render();
    updateLastUpdated();
    updatePublicStockSummary();

    try{
      const settings=await restGet(
        "public_shop_settings?select=*&id=eq.1&limit=1"
      );
      const set=Array.isArray(settings)?settings[0]:null;
      if(set){
        storeNameEl.textContent=lang==="en"?T("store"):(set.store_name||C.STORE_NAME);
        noticeEl.textContent=lang==="en"?"Korean cards · Prices and stock are updated frequently.":(set.notice||"");
        if(set.kakao_openchat_url){
          C.KAKAO_OPENCHAT_URL=set.kakao_openchat_url;
        }
      }
    }catch(e){
      console.warn("상점 설정 조회 실패:",e);
    }

  } catch (e) {
    console.error("card load failed:",e);
    cardsEl.innerHTML=
      '<div class="empty" style="line-height:1.6">'+
      '<b>카드 목록을 불러오지 못했습니다.</b><br>'+
      esc(e?.message||String(e))+
      '<br><button onclick="location.reload()" style="margin-top:8px;padding:8px 12px">다시 불러오기</button>'+
      '</div>';
  }
}

function buildFilters() {
  [...new Set(cards.map(x => x.rarity).filter(Boolean))]
    .sort()
    .forEach(x => rarityEl.insertAdjacentHTML(
      "beforeend",
      `<option>${esc(x)}</option>`
    ));

  [...new Set(cards.map(x => x.variant).filter(Boolean))]
    .sort()
    .forEach(x => variantEl.insertAdjacentHTML(
      "beforeend",
      `<option>${esc(x)}</option>`
    ));
}

function filtered() {
  const s = qEl.value.trim().toLowerCase();

  const list = cards.filter(c =>
    (!s || `${c.name_ko} ${englishName(c)} ${c.card_no}`.toLowerCase().includes(s)) &&
    (!rarityEl.value || c.rarity === rarityEl.value) &&
    (!variantEl.value || c.variant === variantEl.value) &&
    (!finishEl.value || c.finish === finishEl.value) &&
    (!availableOnlyEl?.checked || Boolean(c.stock_many) || Number(c.sell_qty||0)>0)
  );

  const mode = sortOrderEl?.value || "default";

  if (mode === "price_desc") {
    list.sort((a,b) =>
      Number(b.sell_price||0) - Number(a.sell_price||0) ||
      Number(a.sort_no||9999) - Number(b.sort_no||9999)
    );
  } else if (mode === "price_asc") {
    list.sort((a,b) =>
      Number(a.sell_price||0) - Number(b.sell_price||0) ||
      Number(a.sort_no||9999) - Number(b.sort_no||9999)
    );
  } else if (mode === "card_no") {
    list.sort((a,b) =>
      String(a.card_no||"").localeCompare(String(b.card_no||""),"ko",{numeric:true})
    );
  } else if (mode === "sold_desc") {
    list.sort((a,b) =>
      soldQtyFor(b) - soldQtyFor(a) ||
      Number(b.sell_price||0) - Number(a.sell_price||0) ||
      Number(a.sort_no||9999) - Number(b.sort_no||9999)
    );
  } else {
    list.sort((a,b) =>
      Number(a.sort_no||9999) - Number(b.sort_no||9999)
    );
  }

  return list;
}


function formatUpdatedAt(v){
  if(!v) return T("noUpdate");
  const d=new Date(v);
  if(Number.isNaN(d.getTime())) return T("noUpdate");
  const p=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function updateLastUpdated(){
  if(!lastUpdatedEl) return;
  const latest=cards
    .map(c=>c.updated_at)
    .filter(Boolean)
    .sort((a,b)=>new Date(b)-new Date(a))[0];
  lastUpdatedEl.textContent=`${T("updated")} ${formatUpdatedAt(latest)}`;
}

function updatePublicStockSummary(){
  if(!publicStockSummaryEl)return;

  let available=0;
  let manyKinds=0;

  for(const c of cards){
    if(isMany(c)){
      manyKinds+=1;
    }else{
      available+=Math.max(0,Number(c.sell_qty||0));
    }
  }

  const sold=Object.values(soldCounts).reduce((s,v)=>s+Math.max(0,Number(v||0)),0);

  let text=`${T("available")} ${available.toLocaleString()} ${T("cards")}`;
  if(manyKinds>0) text+=` + ${T("many")} ${manyKinds} ${T("kinds")}`;
  text+=` · ${T("sold")} ${sold.toLocaleString()} ${T("cards")}`;

  publicStockSummaryEl.textContent=text;
}


const isMany=c=>Boolean(c.stock_many);
const soldQtyFor=c=>Number(soldCounts[c.code]||0);
const availableQty=c=>isMany(c)?99:Math.max(0,Number(c.sell_qty||0));



const DECK_SECTION_LABELS={
  legend:"전설",
  unit:"유닛",
  spell:"주문",
  battlefield:"전장",
  rune:"룬"
};
const DECK_SECTION_ORDER=["legend","unit","spell","battlefield","rune"];

function deckGroupedHtml(d){
  const items=Array.isArray(d?.items)?d.items:[];
  return `<div class="deck-sections-public">${
    DECK_SECTION_ORDER.map(section=>{
      const list=items.filter(x=>(x.section||"unit")===section);
      if(!list.length)return "";
      const qty=list.reduce((s,x)=>s+Number(x.qty||0),0);
      return `<div class="deck-section-public">
        <div class="deck-section-public-title">${DECK_SECTION_LABELS[section]} · ${qty}장</div>
        <div class="deck-section-public-items">
          ${list.map(x=>{const c=cards.find(v=>v.code===x.code)||x; const en=englishName(c); return `<span class="deck-section-public-item"><b>${esc(x.name_ko||x.card_no||x.code)}</b>${lang==="en"&&en?` <span class="name-en">${esc(en)}</span>`:""} ×${Number(x.qty||0)}</span>`;}).join("")}
        </div>
      </div>`;
    }).join("")
  }</div>`;
}

function deckCalc(d){
  const items=Array.isArray(d?.items)?d.items:[];
  let required=0,buyable=0,total=0,fullTotal=0;
  const missing=[];
  for(const x of items){
    const need=Math.max(0,Number(x.qty||0));
    const avail=Boolean(x.stock_many)?need:Math.max(0,Number(x.available_qty||0));
    const can=Math.min(need,avail);
    const miss=Math.max(0,need-can);
    required+=need;
    buyable+=can;
    total+=can*Number(x.sell_price||0);
    fullTotal+=need*Number(x.sell_price||0);
    if(miss>0){
      missing.push({...x,missing_qty:miss,buyable_qty:can});
    }
  }
  return {required,buyable,total,fullTotal,missing};
}

function renderDeckShop(){
  if(!deckShopEl||!deckChipsEl||!deckPreviewEl)return;
  if(!deckBundles.length){
    deckShopEl.classList.remove("show");
    return;
  }
  deckShopEl.classList.add("show");

  if(!deckBundles.some(d=>String(d.id)===String(selectedDeckId))){
    selectedDeckId=deckBundles[0].id;
  }

  deckChipsEl.innerHTML=deckBundles.map(d=>
    `<button class="deck-chip ${String(d.id)===String(selectedDeckId)?"active":""}" data-deck-id="${d.id}">${esc(d.name)}</button>`
  ).join("");

  if(deckPanelEl) deckPanelEl.classList.toggle("open",deckPanelOpen);
  if(deckPanelToggleEl) deckPanelToggleEl.textContent=deckPanelOpen?T("deckClose"):T("deckOpen");

  const d=deckBundles.find(x=>String(x.id)===String(selectedDeckId));
  if(!d){deckPreviewEl.innerHTML="";return}

  const calc=deckCalc(d);
  const missText=calc.missing.map(x=>
    `${x.card_no||x.code} ${x.name_ko||""} ${x.finish||""} ×${x.missing_qty} ${T("missing")}`
  ).join("<br>");

  deckPreviewEl.innerHTML=`
    <div class="deck-preview-name">${esc(d.name)}</div>
    ${d.description?`<div class="deck-preview-desc">${esc(d.description)}</div>`:""}
    <div class="deck-preview-stats">
      <span>${T("composition")} ${calc.required} ${T("cards")}</span>
      <span>${T("currentBuy")} ${calc.buyable} ${T("cards")}</span>
      <span>${won(calc.total)}</span>
    </div>
    ${deckGroupedHtml(d)}
    ${calc.missing.length
      ? `<div class="deck-preview-missing"><b>${T("missing")} ${calc.required-calc.buyable} ${T("cards")}</b><br>${missText}</div>`
      : `<div class="deck-preview-ok">${T("allBuyable")}</div>`
    }
    <button class="deck-add-btn" data-add-deck="${d.id}" ${calc.buyable<1?"disabled":""}>
      ${T("addAvailable")} ${calc.buyable} ${T("addAtOnce")} · ${won(calc.total)}
    </button>
  `;
}

function addDeckToCart(id){
  const d=deckBundles.find(x=>String(x.id)===String(id));
  if(!d)return;
  const calc=deckCalc(d);

  for(const x of (d.items||[])){
    const c=cards.find(v=>v.code===x.code);
    if(!c)continue;
    const need=Math.max(0,Number(x.qty||0));
    const avail=availableQty(c);
    const canAdd=Math.max(0,Math.min(need,avail-(cart[c.code]||0)));
    if(canAdd>0) cart[c.code]=(cart[c.code]||0)+canAdd;
  }

  render();
  renderDeckShop();
  openCartDrawer();

  if(deckInlineStatusEl){
    deckInlineStatusEl.textContent=calc.missing.length
      ? `${d.name}: 재고 있는 ${calc.buyable}장만 담았어요. 부족 ${calc.required-calc.buyable}장은 위 안내를 확인해 주세요.`
      : `${d.name}: ${calc.buyable}장 전부 담았어요.`;
    deckInlineStatusEl.classList.add("show");
    clearTimeout(addDeckToCart._t);
    addDeckToCart._t=setTimeout(()=>deckInlineStatusEl.classList.remove("show"),5000);
  }
}

deckChipsEl?.addEventListener("click",e=>{
  const b=e.target.closest("[data-deck-id]");
  if(!b)return;
  selectedDeckId=b.dataset.deckId;
  renderDeckShop();
});

deckPanelToggleEl?.addEventListener("click",()=>{

deckPreviewEl?.addEventListener("click",e=>{

});


function render() {
  const list = filtered();

  cardsEl.innerHTML = list.length
    ? list.map(c => {
        const avail = availableQty(c);
        const n = Math.min(cart[c.code] || 0, avail);

        const soldout = !isMany(c) && Number(c.sell_qty||0) <= 0;
        return `
          <article class="card ${soldout ? "soldout" : ""}">
            ${imageHtml(c)}
            ${isCUFoil(c)?'<div class="foil-badge">FOIL</div>':""}
            ${String(c.variant||"").toLowerCase()==="promo"?'<div class="promo-badge">PROMO</div>':isSignature(c)?'<div class="signature-badge">SIGNATURE</div>':""}
            ${soldout ? `<div class="soldout-overlay">${T("soldOut")}</div>` : ""}
            <div class="body">
              <div class="name">${displayNameHtml(c)}</div>
              <div class="meta">
                ${esc(c.card_no)} ·
                ${esc(c.rarity || "")} ·
                ${esc(c.variant || "Standard")} ·
                ${esc(c.finish)}
              </div>
              <div class="price">${c.sell_price > 0 ? won(c.sell_price) : "-"}</div>
              ${
                soldout
                  ? `<div class="soldout-badge">${T("soldOut")}${soldQtyFor(c)>0?` · ${T("sold")} ${soldQtyFor(c)} ${T("cards")}`:""}</div>`
                  : `<div class="stock">${isMany(c)?T("many"):`${T("available")} ${c.sell_qty} ${T("cards")}`}${soldQtyFor(c)>0?` · ${T("sold")} ${soldQtyFor(c)} ${T("cards")}`:""}</div>`
              }

              <div class="buyrow">
                <button ${soldout ? "disabled" : ""} onclick="chg('${esc(c.code)}',-1)">−</button>
                <div class="qty">${soldout ? 0 : n}</div>
                <button ${soldout ? "disabled" : ""} onclick="chg('${esc(c.code)}',1)">＋</button>
              </div>
            </div>
          </article>
        `;
      }).join("")
    : `<div class="empty">${T("noMatches")}</div>`;

  updateCart();
}

function chg(code, d) {
  const c = cards.find(x => x.code === code);
  if (!c) return;

  cart[code] = Math.max(
    0,
    Math.min(availableQty(c), (cart[code] || 0) + d)
  );

  render();
}

function selected() {
  return cards
    .map(c => ({
      ...c,
      buy_qty: Math.min(cart[c.code] || 0, availableQty(c))
    }))
    .filter(c => c.buy_qty > 0);
}

function updateCart() {
  const s = selected();
  const qty = s.reduce((a, c) => a + c.buy_qty, 0);
  const sum = s.reduce((a, c) => a + c.buy_qty * c.sell_price, 0);

  cartSummaryEl.textContent = `${T("selected")} ${qty} ${T("cards")} · ${won(sum)}`;
  if (cartViewBtnEl) cartViewBtnEl.textContent = `${T("viewCart")} (${qty})`;
  renderCartDrawer();
}


function openCartDrawer(){
  renderCartDrawer();
  if(cartDrawerEl){
    cartDrawerEl.classList.add("open");
    document.body.classList.add("cart-open");
  }
}
function closeCartDrawer(){
  if(cartDrawerEl){
    cartDrawerEl.classList.remove("open");
    document.body.classList.remove("cart-open");
  }
}


function cardNoCompare(a,b){
  return String(a.card_no||"").localeCompare(String(b.card_no||""),"ko",{numeric:true});
}
function foilGroupKey(c){
  const variant=String(c.variant||"").trim().toLowerCase();
  const rarity=String(c.rarity||"").trim().toLowerCase();

  if(variant.includes("signature")) return "Signature";
  if(variant.includes("overnumber") || variant.includes("over number") || variant.includes("kr overnumber")) return "Overnumber";
  if(variant.includes("alt")) return "Alt Art";
  if(["legend","legendary"].includes(rarity)) return "Legendary";
  if(rarity==="epic") return "Epic";
  if(rarity==="rare") return "Rare";
  if(["uncommon","common","u","c","언커먼","커먼"].includes(rarity)) return "Common / Uncommon";
  return c.rarity||c.variant||"기타";
}
const FOIL_GROUP_ORDER=["Signature","Overnumber","Alt Art","Legendary","Epic","Rare","Common / Uncommon"];

function groupedSelectedCards(list){
  const normal=list.filter(c=>String(c.finish||"").toUpperCase()!=="FOIL").sort(cardNoCompare);
  const foil=list.filter(c=>String(c.finish||"").toUpperCase()==="FOIL");
  const foilGroups={};
  for(const c of foil){
    const key=foilGroupKey(c);
    (foilGroups[key] ||= []).push(c);
  }
  Object.values(foilGroups).forEach(a=>a.sort(cardNoCompare));
  const foilKeys=Object.keys(foilGroups).sort((a,b)=>{
    const ia=FOIL_GROUP_ORDER.indexOf(a), ib=FOIL_GROUP_ORDER.indexOf(b);
    const aa=ia<0?999:ia, bb=ib<0?999:ib;
    return aa-bb || String(a).localeCompare(String(b),"ko");
  });
  return {normal,foilGroups,foilKeys};
}

function cartItemHtml(c){
  const imgs = cardImageCandidates(c);
  const thumb = imgs.length
    ? `<img class="cart-thumb" src="${esc(imgs[0])}" loading="lazy">`
    : '<div class="cart-thumb"></div>';

  return `
    <div class="cart-item" data-code="${esc(c.code)}">
      ${thumb}
      <div class="cart-info">
        <div class="cart-name">${esc(c.name_ko)}${lang==="en"&&englishName(c)?`<span class="cart-name-en">${esc(englishName(c))}</span>`:""}</div>
        <div class="cart-meta">${esc(c.card_no)} · ${esc(c.rarity||"")} · ${esc(c.variant||"Standard")} · ${esc(c.finish)}</div>
        <div class="cart-price">${won(c.sell_price)} × ${c.buy_qty} = ${won(c.sell_price*c.buy_qty)}</div>
      </div>
      <div class="cart-actions">
        <button class="drawer-minus">−</button>
        <div class="cart-q">${c.buy_qty}</div>
        <button class="drawer-plus">＋</button>
        <button class="cart-remove">삭제</button>
      </div>
    </div>
  `;
}

function renderCartDrawer() {
  const s = selected();
  const qty = s.reduce((a, c) => a + c.buy_qty, 0);
  const sum = s.reduce((a, c) => a + c.buy_qty * c.sell_price, 0);
  const normalQty=s.filter(c=>String(c.finish||"").toUpperCase()!=="FOIL").reduce((a,c)=>a+c.buy_qty,0);
  const foilQty=qty-normalQty;

  drawerQtyEl.textContent = `${T("total")} ${qty} ${T("cards")} · ${T("normal")} ${normalQty} · FOIL ${foilQty}`;
  drawerTotalEl.textContent = won(sum);

  if (!s.length) {
    cartListEl.innerHTML = `<div class="cart-empty">${T("emptyCart")}</div>`;
    return;
  }

  const g=groupedSelectedCards(s);
  const normalHtml=g.normal.length
    ? `<div class="cart-group">
        <div class="cart-group-head"><span>${T("normalCards")}</span><span>${normalQty} ${T("cards")}</span></div>
        ${g.normal.map(cartItemHtml).join("")}
      </div>`
    : "";

  const foilHtml=foilQty
    ? `<div class="cart-group">
        <div class="cart-group-head"><span>FOIL</span><span>${foilQty} ${T("cards")}</span></div>
        ${g.foilKeys.map(key=>`
          <div class="cart-subgroup-head">${esc(key)} · ${g.foilGroups[key].reduce((a,c)=>a+c.buy_qty,0)} ${T("cards")}</div>
          ${g.foilGroups[key].map(cartItemHtml).join("")}
        `).join("")}
      </div>`
    : "";

  cartListEl.innerHTML=normalHtml+foilHtml;
}

function orderText(orderId=null) {
  const s = selected();
  if (!s.length) return "";

  const qty = s.reduce((a, c) => a + c.buy_qty, 0);
  const sum = s.reduce((a, c) => a + c.buy_qty * c.sell_price, 0);
  const g=groupedSelectedCards(s);
  const normalQty=g.normal.reduce((a,c)=>a+c.buy_qty,0);
  const foilQty=qty-normalQty;
  const unit=lang==="en"?"cards":"장";

  const lines=[
    T("inquiry"),
    ...(orderId ? [`${T("orderNo")} #${String(orderId).padStart(6,"0")}`] : []),
    `${T("total")} ${qty} ${unit} · ${T("normal")} ${normalQty} ${unit} · FOIL ${foilQty} ${unit} / ${won(sum)}`,
    ""
  ];

  if(g.normal.length){
    lines.push(`[${T("normalCards")} · ${normalQty} ${unit}]`);
    for(const c of g.normal){
      lines.push(`${c.card_no} ${orderDisplayName(c)} ×${c.buy_qty} — ${won(c.sell_price*c.buy_qty)}`);
    }
    lines.push("");
  }

  if(foilQty){
    lines.push(`[FOIL · ${foilQty} ${unit}]`);
    for(const key of g.foilKeys){
      const list=g.foilGroups[key];
      const subQty=list.reduce((a,c)=>a+c.buy_qty,0);
      lines.push(`<${key} · ${subQty} ${unit}>`);
      for(const c of list){
        lines.push(`${c.card_no} ${orderDisplayName(c)} ×${c.buy_qty} — ${won(c.sell_price*c.buy_qty)}`);
      }
      lines.push("");
    }
  }

  lines.push(`${T("total")} ${qty} ${unit} / ${won(sum)}`);
  return lines.join("\n");
}


function pendingOrderItems(){
  return selected().map(c=>({
    code:c.code,
    qty:Number(c.buy_qty||0),
    unit_price:Number(c.sell_price||0),
    line_total:Number(c.sell_price||0)*Number(c.buy_qty||0),
    name_ko:c.name_ko||"",
    name_en:englishName(c)||"",
    card_no:c.card_no||"",
    finish:c.finish||"",
    rarity:c.rarity||"",
    variant:c.variant||"",
    stock_many:Boolean(c.stock_many)
  }));
}

async function kakaoInquiry(){
  const items=pendingOrderItems();
  if(!items.length){
    alert(T("selectCard"));
    return;
  }
  if(!C.KAKAO_OPENCHAT_URL || C.KAKAO_OPENCHAT_URL.includes("YOUR_LINK")){
    alert(T("kakaoMissing"));
    return;
  }

  const totalQty=items.reduce((a,x)=>a+x.qty,0);
  const totalAmount=items.reduce((a,x)=>a+x.line_total,0);

  // 비동기 처리 뒤 팝업이 막히는 것을 줄이기 위해 먼저 빈 창을 연다.
  const popup=window.open("about:blank","_blank");

  try{
    const data=await restRpc("submit_pending_order",{
      p_items:items,
      p_total_qty:totalQty,
      p_total_amount:totalAmount
    });

    const orderId=Number(data);
    const t=orderText(orderId);

    try{
      await navigator.clipboard.writeText(t);
    }catch{
      // 클립보드 권한이 막힌 경우 아래 prompt에서 직접 복사 가능
      prompt("구매목록을 복사해 주세요.",t);
    }

    alert(`${T("orderNo")} #${String(orderId).padStart(6,"0")} ${T("orderDone")}`);

    if(popup) popup.location.href=C.KAKAO_OPENCHAT_URL;
    else window.location.href=C.KAKAO_OPENCHAT_URL;
  }catch(err){
    if(popup) popup.close();
    alert(T("orderFail")+(err?.message||err));
  }
}

cartListEl.addEventListener("click", e => {

  if (!c) return;

    cart[code] = Math.max(0, (cart[code] || 0) - 1);

  } else if (e.target.classList.contains("cart-remove")) {
    cart[code] = 0;
  } else {
    return;
  }

  render();
  renderCartDrawer();
});
